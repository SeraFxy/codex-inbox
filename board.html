<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 任务台账</title>
<link rel="icon" id="favicon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* Blink 视觉规范：九成灰阶，颜色只表达状态；实色只给「现在需要你」。数字、时间、短码用等宽。 */
:root {
  --bk-ground: #F5F7F9; --bk-surface: #FFFFFF; --bk-subtle: #F9FAFC; --bk-sunken: #EEF0F3;
  --bk-line: #E0E3E7; --bk-line-strong: #CCD0D5;
  --bk-ink-4: #A0A5AB; --bk-ink-3: #6D7279; --bk-ink-2: #50565D; --bk-ink-1: #1B2026;
  --bk-pri: #1B2026; --bk-pri-hover: #30363D; --bk-pri-active: #0E1115; --bk-pri-text: #FFFFFF;
  --bk-needs: #F04C35; --bk-needs-ink: #BA2D1B; --bk-needs-tint: #FFEFEC; --bk-needs-line: #FFD1C8;
  --bk-run: #3874EA; --bk-run-ink: #235BC8; --bk-run-tint: #EEF5FF; --bk-run-soft: #D8E7FF; --bk-run-line: #CEDFFD;
  --bk-review: #32B36E; --bk-review-ink: #0B7643; --bk-review-tint: #E7FAEC; --bk-review-soft: #CCF3D8; --bk-review-line: #C0EACD;
  --bk-timer: #F3AB2A; --bk-timer-ink: #955816; --bk-timer-tint: #FFF5DC; --bk-timer-soft: #FFEAB8; --bk-timer-line: #FADDA9;
  --bk-peer: #9867E1; --bk-peer-ink: #7444B4; --bk-peer-tint: #F6F2FF; --bk-peer-soft: #EAE0FF; --bk-peer-line: #E3D7FB;
  --bk-lime: #CCFB5B; --bk-lime-mark: #DBFE7D;
  --bk-logo: #1B2026; --bk-logo-rim: transparent; --bk-load-box: #2F363E; --bk-toast: #1B2026;
  --bk-e1: 0 1px 2px rgba(16, 20, 25, .04);
  --bk-e2: 0 6px 16px -6px rgba(16, 20, 25, .12);
  --bk-e3: 0 16px 36px -12px rgba(16, 20, 25, .22), 0 2px 6px rgba(16, 20, 25, .06);
  --bk-e-toast: 0 16px 36px -12px rgba(16, 20, 25, .4), 0 2px 6px rgba(16, 20, 25, .12);
  --bk-on: 0 1px 2px rgba(16, 20, 25, .06), 0 0 0 1px rgba(16, 20, 25, .06);
  --bk-ring: rgba(27, 32, 38, .08);
  --bk-scrim: rgba(16, 20, 25, .28);
  --bk-ease: cubic-bezier(.2, .8, .2, 1);
  --bk-sans: "Geist", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
  --bk-mono: "Geist Mono", "SF Mono", Menlo, Consolas, "PingFang SC", "Noto Sans CJK SC", monospace;
  color-scheme: light;
}
/* 深色：规范只画了浅色，这里按同一套 token 换明度，结构不变 */
@media (prefers-color-scheme: dark) {
  :root {
    --bk-ground: #0F1215; --bk-surface: #171B20; --bk-subtle: #1A1F24; --bk-sunken: #22272E;
    --bk-line: #2B3139; --bk-line-strong: #3B424B;
    --bk-ink-4: #5D646C; --bk-ink-3: #979DA4; --bk-ink-2: #B9BEC4; --bk-ink-1: #ECEEF1;
    --bk-pri: #ECEEF1; --bk-pri-hover: #D6DADF; --bk-pri-active: #C4C9CF; --bk-pri-text: #14181C;
    --bk-needs-ink: #FF8D7C; --bk-needs-tint: rgba(240, 76, 53, .14); --bk-needs-line: rgba(240, 76, 53, .36);
    --bk-run-ink: #8EB5FF; --bk-run-tint: rgba(56, 116, 234, .14); --bk-run-soft: #22375C; --bk-run-line: rgba(56, 116, 234, .36);
    --bk-review-ink: #71D79D; --bk-review-tint: rgba(50, 179, 110, .14); --bk-review-soft: #1C3D2A; --bk-review-line: rgba(50, 179, 110, .36);
    --bk-timer-ink: #F4C56C; --bk-timer-tint: rgba(243, 171, 42, .14); --bk-timer-soft: #45341A; --bk-timer-line: rgba(243, 171, 42, .36);
    --bk-peer-ink: #C3A5F6; --bk-peer-tint: rgba(152, 103, 225, .16); --bk-peer-soft: #352850; --bk-peer-line: rgba(152, 103, 225, .38);
    --bk-logo: #2C333B; --bk-logo-rim: rgba(255, 255, 255, .18); --bk-load-box: #1B2026; --bk-toast: #2A3038;
    --bk-e1: 0 1px 2px rgba(0, 0, 0, .3);
    --bk-e2: 0 6px 16px -6px rgba(0, 0, 0, .5);
    --bk-e3: 0 16px 36px -12px rgba(0, 0, 0, .6), 0 2px 6px rgba(0, 0, 0, .3);
    --bk-e-toast: 0 16px 36px -12px rgba(0, 0, 0, .7), 0 0 0 1px rgba(255, 255, 255, .06);
    --bk-on: 0 1px 2px rgba(0, 0, 0, .4), 0 0 0 1px rgba(255, 255, 255, .07);
    --bk-ring: rgba(236, 238, 241, .12);
    --bk-scrim: rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bk-ground); color: var(--bk-ink-1); font: 14px/22px var(--bk-sans); -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
a { color: var(--bk-run-ink); }
a:hover { color: var(--bk-ink-1); }
a:focus-visible, button:focus-visible { outline: 2px solid var(--bk-ink-1); outline-offset: 2px; }
[hidden] { display: none !important; }
.mono { font-family: var(--bk-mono); }

/* 小表情与动效：每种状态最多一个动作；系统「减少动态效果」时全部静止 */
@keyframes bk-blink { 0%, 90%, 100% { transform: scaleY(1); } 93% { transform: scaleY(.12); } 96% { transform: scaleY(1); } }
@keyframes bk-scan { 0%, 100% { transform: translateX(-1.6px); } 45%, 55% { transform: translateX(1.6px); } }
@keyframes bk-doze { 0% { opacity: 0; transform: translate(0, 1px); } 30% { opacity: 1; } 100% { opacity: 0; transform: translate(1.5px, -2.5px); } }
@keyframes bk-hop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@keyframes bk-rise { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
@keyframes bk-drop { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
@keyframes bk-slide { from { opacity: .6; transform: translateX(32px); } to { opacity: 1; transform: translateX(0); } }
@keyframes bk-fade { from { opacity: 0; } to { opacity: 1; } }
.bk-blink { transform-box: fill-box; transform-origin: center; animation: bk-blink 5.2s infinite; }
.bk-scan { animation: bk-scan 2.6s cubic-bezier(.45, 0, .55, 1) infinite; }
.bk-doze { animation: bk-doze 3.2s ease-out infinite; }
.bk-hop { animation: bk-hop .24s var(--bk-ease) 1; }
.face { flex: none; display: block; }
.face.faded { opacity: .55; }
@media (prefers-reduced-motion: reduce) {
  .bk-blink, .bk-scan, .bk-doze, .bk-hop, .menu, .toast, .tagpop, .hist-panel, .hist-scrim { animation: none !important; }
  * { transition: none !important; }
}

/* 按钮：主 = 墨色实底（一个区域最多一个），次 = 白底描边，幽灵 = 无底悬停变灰 */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 12px;
  border: 1px solid transparent; border-radius: 10px; background: transparent; color: var(--bk-ink-2);
  font-size: 13px; font-weight: 500; line-height: 20px; white-space: nowrap; text-decoration: none; cursor: pointer;
  transition: background-color .12s, border-color .12s, color .12s, transform .12s;
}
.btn:active { transform: scale(.98); }
.btn.pri { padding: 0 14px; background: var(--bk-pri); color: var(--bk-pri-text); font-weight: 600; }
.btn.pri:hover { background: var(--bk-pri-hover); color: var(--bk-pri-text); }
.btn.pri:active { background: var(--bk-pri-active); }
.btn.sec { background: var(--bk-surface); border-color: var(--bk-line); color: var(--bk-ink-1); }
.btn.sec:hover { background: var(--bk-ground); border-color: var(--bk-line-strong); }
.btn.ghost:hover, .btn.ghost.on { background: var(--bk-sunken); color: var(--bk-ink-1); }
.btn.loading { pointer-events: none; padding-left: 10px; gap: 8px; }
.btn.hd { height: 32px; }
.btn.sm { height: 30px; padding: 0 8px; }
.btn.xs { height: 28px; padding: 0 8px; border-radius: 8px; font-size: 12px; }
.btn.icon { width: 32px; height: 32px; padding: 0; border-radius: 8px; }
.btn svg { flex: none; }

/* 标签与徽标：只有理由标签和红色计数带颜色，其余全灰 */
.chip {
  flex: none; display: inline-flex; align-items: center; max-width: 14em; height: 20px; padding: 0 6px; border: 0; border-radius: 6px;
  background: var(--bk-sunken); color: var(--bk-ink-2); font: 600 11px/20px var(--bk-mono); letter-spacing: .02em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.chip.sm { height: 18px; padding: 0 5px; border-radius: 5px; font-size: 10.5px; line-height: 18px; }
.chip.tool { background: transparent; box-shadow: inset 0 0 0 1px var(--bk-line-strong); color: var(--bk-ink-1); }   /* 工具：描边，和填色的项目标签分开 */
.chip.tool.off { box-shadow: inset 0 0 0 1px var(--bk-line); color: var(--bk-ink-3); }   /* 暂停了的 Codex 定时任务 */
button.chip { cursor: pointer; transition: box-shadow .12s; }
button.chip:hover { box-shadow: inset 0 0 0 1px var(--bk-ink-1); }
.count { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; font: 600 11px/18px var(--bk-mono); }
.count.hot { background: var(--bk-needs); color: #FFFFFF; }
kbd.k {
  display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 4px;
  border: 1px solid var(--bk-line-strong); border-bottom-width: 2px; border-radius: 4px; background: var(--bk-surface);
  color: var(--bk-ink-2); font: 10.5px/1 var(--bk-mono);
}
kbd.k.md { min-width: 20px; height: 20px; padding: 0 5px; border-radius: 5px; font-size: 11px; }
kbd.k.lg { min-width: 22px; height: 22px; padding: 0 6px; border-radius: 6px; font-size: 12px; }

/* 页头 */
.brand { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; min-width: 0; }
.brand h1 { margin: 0; font-size: 16px; line-height: 22px; font-weight: 600; }
.brand .stack { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.metam { font: 12px/16px var(--bk-mono); color: var(--bk-ink-3); }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.btn.sec.searchbtn { justify-content: flex-start; gap: 8px; width: 280px; max-width: 100%; padding: 0 8px 0 10px; color: var(--bk-ink-3); font-weight: 400; }
.searchbtn span { flex: 1; text-align: left; }
.sync { display: inline-flex; align-items: center; gap: 6px; padding: 0 2px 0 4px; font: 12px/16px var(--bk-mono); color: var(--bk-ink-3); }
.sync .dot { width: 6px; height: 6px; border-radius: 999px; background: var(--bk-review); }
.sync.busy { color: var(--bk-ink-2); }
.sync.bad { color: var(--bk-needs-ink); }

/* 看板：左栏项目与主题，中间队列，右边详情 */
.board { display: flex; flex-direction: column; min-height: 100vh; }
.bhead { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; padding: 12px clamp(16px, 2vw, 24px); }
.split { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: stretch; border-top: 1px solid var(--bk-line); }
.queue { flex: 0 1 420px; min-width: 0; padding: 16px 12px; border-right: 1px solid var(--bk-line); display: flex; flex-direction: column; gap: 14px; }
.queue > * { flex-shrink: 0; }   /* 这一栏自己滚动：提示折行时别被压扁、压到下面的卡片上 */
.detail { flex: 999 1 540px; min-width: 0; padding: 0 clamp(16px, 3vw, 44px) 40px; background: var(--bk-surface); }
/* 上边距放在里面这层：详情栏是滚动容器，它自己有上内边距的话，贴顶的导航在有的浏览器里会停在内边距下面，上面露出一条正文 */
.detail-in { width: 100%; max-width: 900px; min-height: 100%; padding-top: 24px; display: flex; flex-direction: column; gap: 26px; }
/* 详情的页内导航：贴在顶上，点一下滚到那一段 */
.dnav { position: sticky; top: 0; z-index: 3; display: flex; gap: 2px; margin: -14px 0 -10px; padding: 8px 0; overflow-x: auto; scrollbar-width: none;
  background: var(--bk-surface); box-shadow: 0 1px 0 var(--bk-line); }
.dnav::-webkit-scrollbar { display: none; }
.dnav button { flex: none; height: 32px; padding: 0 12px; border: 0; border-radius: 10px; background: transparent; color: var(--bk-ink-2);
  font-size: 13px; line-height: 20px; font-weight: 500; cursor: pointer; transition: background-color .12s, color .12s; }
.dnav button:hover { color: var(--bk-ink-1); background: var(--bk-sunken); }
.dnav button[aria-current="true"] { background: var(--bk-sunken); color: var(--bk-ink-1); font-weight: 600; }
.dnav button:focus-visible { outline: 2px solid var(--bk-ink-1); outline-offset: -2px; }
.dnav .dnav-history { display: inline-flex; align-items: center; gap: 6px; }
[id^="ds-"] { scroll-margin-top: 64px; }
@media (min-width: 961px) {
  .board { height: 100vh; height: 100dvh; min-height: 0; }
  .split { flex-wrap: nowrap; min-height: 0; }
  .rail, .queue, .detail { overflow-y: auto; overscroll-behavior: contain; }
}
@media (max-width: 960px) {
  .queue { flex-basis: 100%; border-right: 0; border-bottom: 1px solid var(--bk-line); }
}

/* 左栏：点项目或主题，中间只剩它的会话；红色数字 = 里面有轮到你的事。收起后队列顶上留展开按钮和切换下拉 */
.rail { flex: 0 0 232px; min-width: 0; display: flex; flex-direction: column; gap: 2px; padding: 16px 12px; border-right: 1px solid var(--bk-line); }
.split.railx .rail { display: none; }
.rhead { display: flex; align-items: center; gap: 2px; padding: 0 0 6px 10px; }
.rhead > span { flex: 1; font-size: 12px; line-height: 16px; font-weight: 600; color: var(--bk-ink-3); }
.rhead .btn.icon { width: 28px; height: 28px; }
.ri {
  flex: none; display: flex; align-items: center; gap: 8px; width: 100%; min-width: 0; height: 32px; padding: 0 10px; border: 0; border-radius: 10px;
  background: transparent; color: var(--bk-ink-1); font-size: 13px; text-align: left; cursor: pointer; transition: background-color .12s, box-shadow .12s;
}
.ri:hover { background: var(--bk-sunken); }
.ri[aria-current="true"] { background: var(--bk-surface); box-shadow: var(--bk-on); font-weight: 600; }
.ri:focus-visible, .rfold:focus-visible { outline: 2px solid var(--bk-ink-1); outline-offset: 1px; }
.ri .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ri .n { font: 500 12px/1 var(--bk-mono); color: var(--bk-ink-3); }
.ri.all { height: 34px; font-weight: 600; }
.ri.proj { padding-left: 4px; font-weight: 600; }
.ri.sub { padding-left: 28px; }
.rp .ri, .rt .ri { flex: 1; width: auto; }
.ri.proj .nm { font: 600 12px/16px var(--bk-mono); }
.ri.none { color: var(--bk-ink-3); }
.ri.drop { background: var(--bk-sunken); box-shadow: inset 0 0 0 1.5px var(--bk-ink-1); }
.rgroup { position: relative; display: flex; flex-direction: column; gap: 2px; margin-top: 8px; }
.rgroup.dragging { opacity: .4; }
.rp, .rt { position: relative; display: flex; align-items: center; }
.rfold {
  flex: none; display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 32px; padding: 0; border: 0;
  border-radius: 8px; background: transparent; color: var(--bk-ink-3); cursor: pointer;
}
.rp .ra, .rt .ra { position: absolute; right: 4px; top: 3px; display: none; }
.rp:hover .ra, .rp:focus-within .ra, .rp .ra.on, .rt:hover .ra, .rt:focus-within .ra, .rt .ra.on { display: inline-flex; }
.rp:hover .ri .n, .rp:hover .ri .count, .rp:focus-within .ri .n, .rp:focus-within .ri .count,
.rt:hover .ri .n, .rt:hover .ri .count, .rt:focus-within .ri .n, .rt:focus-within .ri .count { visibility: hidden; }
.rsec { display: flex; align-items: center; gap: 4px; width: 100%; height: 28px; margin-top: 16px; padding: 0 10px 0 4px; border: 0; border-radius: 8px;
  background: transparent; color: var(--bk-ink-3); font-size: 12px; line-height: 16px; font-weight: 600; text-align: left; cursor: pointer; }
.rsec:hover { color: var(--bk-ink-1); }
.rsec:focus-visible { outline: 2px solid var(--bk-ink-1); outline-offset: 1px; }
.rsec .n { margin-left: auto; font: 500 12px/1 var(--bk-mono); }
.rfav-head { display: flex; align-items: center; gap: 4px; margin-top: 16px; }
.rfav-head .rsec { flex: 1; margin-top: 0; }
.rfav-head .btn { flex: none; }
.ri.fav { padding-left: 26px; gap: 6px; }
.rfg { flex: none; padding: 8px 10px 2px 26px; font-size: 12px; line-height: 16px; color: var(--bk-ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }   /* 收藏里的主题小标题 */
.rof-tree .of-fold { gap: 4px; padding-left: 12px; }
.rof-tree .of-fold svg { flex: none; color: var(--bk-ink-3); }
.rof-tree .of-sub { padding-left: 28px; color: var(--bk-ink-2); }
.rof-tree .ri.fav { padding-left: 44px; padding-right: 36px; }
@media (hover: none) { .rof-tree .rt .ra { display: inline-flex; } }
.ri.off .nm { color: var(--bk-ink-3); }   /* 暂停了的定时任务，和「已暂停的 N 个」那一行 */
.rfoot { margin: auto 0 0; padding: 12px 10px 0; font-size: 12px; line-height: 18px; color: var(--bk-ink-3); }
.qtop { display: none; align-items: center; gap: 6px; margin-bottom: -4px; }
.split.railx .qtop { display: flex; }
.scopebtn { max-width: 100%; padding: 0 8px 0 10px; font-weight: 600; }
.scopebtn > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 960px) {
  .rail { display: none; }
  .qtop { display: flex; }
  .qtop .railbtn { display: none; }
}

.tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; padding: 3px; border-radius: 12px; background: var(--bk-sunken); }
.tab {
  display: flex; align-items: center; justify-content: center; gap: 6px; min-width: 0; height: 34px; padding: 0 6px;
  border: 0; border-radius: 9px; background: transparent; color: var(--bk-ink-2); font-size: 13px; font-weight: 500;
  white-space: nowrap; cursor: pointer; transition: color .12s;
}
.tab:hover { color: var(--bk-ink-1); }
.tab[aria-selected="true"] { background: var(--bk-surface); color: var(--bk-ink-1); font-weight: 600; box-shadow: var(--bk-on); }
.tab .n { font: 500 12px/1 var(--bk-mono); color: var(--bk-ink-3); }
.qbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 2px 12px; min-height: 28px; margin-top: -4px; padding-left: 8px; }
.qhint { margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 0 6px; font-size: 13px; line-height: 20px; color: var(--bk-ink-3); }
.qsync { display: inline-flex; align-items: center; gap: 2px; }
.qsync .btn.icon { width: 28px; height: 28px; }
.qgroup { display: flex; flex-direction: column; gap: 2px; }
.qlabel { padding: 2px 10px 4px; font-size: 12px; line-height: 16px; color: var(--bk-ink-3); }
.row {
  position: relative; display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 3px 10px; align-items: center; width: 100%; padding: 10px;
  border: 0; border-radius: 12px; background: transparent; color: var(--bk-ink-1); text-align: left; cursor: pointer;
  transition: background-color .12s, opacity .12s;
}
.row:focus-visible { outline: 2px solid var(--bk-ink-1); outline-offset: 2px; }
.row:hover, .row[aria-current="true"] { background: var(--bk-surface); }
.row[aria-current="true"] { box-shadow: var(--bk-on); }
.row .fc { grid-row: span 2; align-self: start; display: flex; padding-top: 1px; }
.row .t { min-width: 0; font-size: 14px; line-height: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .w { font: 500 12px/20px var(--bk-mono); color: var(--bk-ink-2); white-space: nowrap; }
.row .w.hot { color: var(--bk-needs-ink); }
.row .s { grid-column: 2 / 4; display: flex; align-items: center; gap: 6px; min-width: 0; padding-right: 28px; font-size: 13px; line-height: 18px; color: var(--bk-ink-3); }
.row .s > span:last-child { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* 行内快捷操作：悬停或选中时出现在第二行右侧，盖住摘要的尾巴，不挡时间 */
.racts { position: absolute; right: 6px; bottom: 5px; display: flex; align-items: center; gap: 2px; }
.racts .ra:not([data-hist-open]) { display: none; }
.row:is(:hover, [aria-current="true"], :focus-within) .racts { padding-left: 18px; background: linear-gradient(to right, transparent, var(--bk-surface) 16px); }
.row:is(:hover, [aria-current="true"], :focus-within) .racts .ra { display: inline-flex; }
.ra {
  display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 26px; padding: 0; border: 0; border-radius: 8px;
  background: transparent; color: var(--bk-ink-2); cursor: pointer; transition: background-color .12s, color .12s;
}
.ra:hover, .ra.on { background: var(--bk-sunken); color: var(--bk-ink-1); }
.ra:focus-visible { outline: 2px solid var(--bk-ink-1); outline-offset: 1px; }
/* 拖动：会话拖到左栏归主题，左栏拖项目换位置 */
.row.dragging { opacity: .4; }
.rgroup.drop-before::before, .rgroup.drop-after::after {
  content: ""; position: absolute; left: 10px; right: 10px; height: 2px; border-radius: 2px; background: var(--bk-ink-1); pointer-events: none;
}
.rgroup.drop-before::before { top: -5px; }
.rgroup.drop-after::after { bottom: -5px; }
.dash { display: flex; align-items: center; gap: 12px; margin: 0 4px; padding: 16px; border: 1px dashed var(--bk-line-strong); border-radius: 14px; }
.dash .tx { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.dash b { font-size: 14px; line-height: 20px; font-weight: 600; }
.dash .tx span { font-size: 13px; line-height: 20px; color: var(--bk-ink-3); }
.dash.card { flex-direction: column; align-items: flex-start; gap: 10px; padding: 14px; background: var(--bk-surface); }
.dash.card > span { font-size: 13px; line-height: 20px; color: var(--bk-ink-2); }
.qfoot { margin-top: auto; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding-top: 4px; }
.kbd-hints { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 8px 8px 0; font-size: 12px; line-height: 20px; color: var(--bk-ink-3); }
.kbd-hints span { display: inline-flex; align-items: center; gap: 4px; }

/* 详情 */
.dhead { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 14px 16px; }
.dtitle { flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.dtitle h2 { margin: 0; font-size: 22px; line-height: 30px; font-weight: 600; letter-spacing: -.01em; word-break: break-word; }
.dmeta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font: 12px/18px var(--bk-mono); color: var(--bk-ink-3); }
.dacts { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.session-labels { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px; min-width: 0; max-width: 100%; }
.session-labels .chip { max-width: 100%; white-space: normal; overflow-wrap: anywhere; }
.historic-task-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--bk-ink-3); }
.menu {
  position: fixed; z-index: 35; width: 240px; padding: 6px; display: flex; flex-direction: column; gap: 2px;
  border: 1px solid var(--bk-line); border-radius: 14px; background: var(--bk-surface); box-shadow: var(--bk-e3); animation: bk-drop .14s var(--bk-ease);
}
.menu .ml { padding: 6px 10px 4px; font-size: 12px; line-height: 16px; color: var(--bk-ink-3); }
.menu button {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 36px; padding: 0 10px;
  border: 0; border-radius: 8px; background: transparent; color: var(--bk-ink-1); font-size: 13px; cursor: pointer;
}
.menu button:hover, .menu button:focus-visible { background: var(--bk-ground); }
.menu button > span:last-child { flex: none; font: 12px var(--bk-mono); color: var(--bk-ink-3); }
.menu button > span:first-child { display: inline-flex; align-items: center; gap: 6px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.menu button.sub { padding-left: 24px; }
.menu button[aria-current="true"] { font-weight: 600; }
/* 归到主题：搜索框 + 可滚动的主题列表 */
.menu.wide { width: 280px; }
.menu input {
  height: 36px; margin: 2px 2px 4px; padding: 0 10px; border: 1px solid var(--bk-line-strong); border-radius: 12px; background: var(--bk-surface);
  color: var(--bk-ink-1); font-size: 13px; outline: none; transition: border-color .12s, box-shadow .12s;
}
.menu input:focus { border-color: var(--bk-ink-1); box-shadow: 0 0 0 4px var(--bk-ring); }
.menu .mlist { display: flex; flex-direction: column; gap: 2px; max-height: 280px; overflow-y: auto; }
.menu .mlist > * { flex: none; }
.menu .mnone { padding: 6px 10px 8px; font-size: 13px; line-height: 20px; color: var(--bk-ink-3); }
.menu hr { height: 1px; margin: 4px 6px; border: 0; background: var(--bk-line); }
.menu.out-session-menu { width: min(384px, calc(100vw - 16px)); }
.out-session-menu .mlist { max-height: min(320px, calc(100dvh - 144px)); overscroll-behavior: contain; }
.out-session-menu .out-session-option { height: 48px; text-align: left; }
.out-session-option .out-session-name { display: grid; gap: 2px; min-width: 0; }
.out-session-name > span, .out-session-name small, #out-session-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.out-session-name small { color: var(--bk-ink-3); font: 12px/16px var(--bk-mono); font-weight: 400; }
.part { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.part.tight { gap: 6px; }
.sec-t { font-size: 15px; line-height: 22px; font-weight: 600; }
.sec-l { font-size: 12px; line-height: 16px; color: var(--bk-ink-3); }
.sec-hd { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.sec-hd .mono { font-size: 12px; color: var(--bk-ink-3); }
.now { margin: 0; font-size: 17px; line-height: 28px; text-wrap: pretty; word-break: break-word; }

/* 待你决定：点选项拼成一条回复，只复制、打开会话，由你自己粘贴发出去（不替你发，见 AGENTS.md 设计原则） */
.dlist { display: flex; flex-direction: column; gap: 1px; border: 1px solid var(--bk-line); border-radius: 14px; background: var(--bk-sunken); overflow: hidden; }
.dq { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 12px 10px 14px; background: var(--bk-surface); }
.dq .n { flex: none; width: 16px; font: 12px/20px var(--bk-mono); color: var(--bk-ink-3); }
.dq .q { flex: 1 1 220px; min-width: 0; font-size: 14px; line-height: 21px; word-break: break-word; }
.dq .opts { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.dq .qm { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 4px; }
.dq .age { font: 12px/16px var(--bk-mono); color: var(--bk-ink-3); }
.dq .qw { display: block; margin-top: 4px; font-size: 13px; line-height: 20px; color: var(--bk-ink-2); }   /* 它为什么推荐这个 / 为什么这么定 */
/* 「它怎么说」：它在回复里讲这件的那一段，展开在问题下面，左边一道竖线表示是引它的原话 */
.dq .dctx { display: flex; flex-direction: column; gap: 6px; flex: 1 1 100%; min-width: 0; margin: 0 0 4px 28px; padding: 2px 0 2px 14px; border-left: 2px solid var(--bk-line-strong); }
.dq .dctx .fold { max-height: 320px; }
.dq .dtog { margin-left: -8px; }   /* 字和问题对齐 */
.sec-hd .hd-r { display: inline-flex; align-items: baseline; gap: 8px; }
.chip.ask { background: var(--bk-needs-tint); color: var(--bk-needs-ink); }   /* 之前问过、你还没答的 ❓：红字，球在你这边 */
.opt {
  min-height: 30px; padding: 4px 12px; border: 1px solid var(--bk-line); border-radius: 8px; background: var(--bk-surface);
  color: var(--bk-ink-1); font-size: 13px; line-height: 20px; font-weight: 500; text-align: left; cursor: pointer; transition: border-color .12s;
}
.opt:hover { border-color: var(--bk-ink-1); }
.opt[aria-pressed="true"] { border-color: var(--bk-pri); background: var(--bk-pri); color: var(--bk-pri-text); }
.opt.rec { border-color: var(--bk-line-strong); }   /* 它推荐的选项：边框深一点，后面跟个「荐」 */
.opt .rk { margin-left: 6px; font-size: 12px; font-weight: 400; color: var(--bk-ink-3); }
.opt[aria-pressed="true"] .rk { color: inherit; }
.opt.lg { min-height: 34px; padding: 6px 12px; border-radius: 10px; font-weight: 400; }
.opts-row { display: flex; flex-wrap: wrap; gap: 8px; }
.part .todo { margin: 0; font-size: 15px; line-height: 22px; font-weight: 600; text-wrap: pretty; word-break: break-word; }
.reply { display: flex; flex-direction: column; gap: 10px; padding: 12px 12px 12px 14px; border: 1px solid var(--bk-line-strong); border-radius: 14px; box-shadow: var(--bk-e1); }
.reply textarea {
  display: block; width: 100%; min-height: 76px; max-height: 60vh; padding: 8px 12px; resize: vertical; border: 1px solid var(--bk-line); border-radius: 12px;
  background: var(--bk-surface); font-size: 14px; line-height: 22px; outline: none; transition: border-color .12s, box-shadow .12s;
}
.reply textarea::placeholder { color: var(--bk-ink-3); }
.reply textarea:focus { border-color: var(--bk-ink-1); box-shadow: 0 0 0 4px var(--bk-ring); }
.rfoot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
.rfoot .rl { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.rfoot .rh { font-size: 12px; line-height: 18px; color: var(--bk-ink-3); }
.rfoot .bs { display: flex; gap: 6px; }

/* 详情顶上的概要：状态、下一步、目标放在一张卡里 */
.sum { display: flex; flex-direction: column; gap: 14px; padding: 16px 20px; border: 1px solid var(--bk-line); border-radius: 14px; background: var(--bk-surface); box-shadow: var(--bk-e1); }
.sum-now { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.sum-st { font-size: 12px; line-height: 16px; font-weight: 600; color: var(--bk-ink-3); }
.sum-why { margin: 0; font-size: 13px; line-height: 20px; color: var(--bk-ink-2); text-wrap: pretty; }
.sum-goal { display: flex; flex-direction: column; gap: 6px; margin: 0; padding-top: 12px; border-top: 1px solid var(--bk-sunken); }
.sum-goal > div { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 12px; font-size: 13px; line-height: 20px; }
.sum-goal dt { color: var(--bk-ink-3); }
.sum-goal dt .pill { margin: 0 0 0 4px; height: 18px; font-size: 11px; }
.sum-goal dd { margin: 0; color: var(--bk-ink-1); word-break: break-word; text-wrap: pretty; }
.sum-goal dd code { padding: 0 4px; border-radius: 4px; background: var(--bk-sunken); font: 12px/20px var(--bk-mono); }
.sum-goal dd b { font-weight: 600; }
.sum-src { margin-left: 8px; font-size: 12px; color: var(--bk-ink-3); white-space: nowrap; }
.sum-goal.nogoal { padding: 12px 0 0; border: 0; border-top: 1px dashed var(--bk-line-strong); border-radius: 0; flex-direction: row; }
@media (max-width: 640px) { .sum { padding: 14px 16px; } .sum-goal > div { grid-template-columns: 1fr; gap: 0; } }
/* 大段之间加一条细线，一眼分得清哪段是哪段 */
.dsec { padding-top: 20px; border-top: 1px solid var(--bk-line); }

/* 对话：都靠左，一条一条往下读。你说的放浅灰底，它说的直接排在白底上 */
.thread { display: flex; flex-direction: column; gap: 18px; }
.tm { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.tm-h { display: flex; align-items: center; gap: 8px; font-size: 12px; line-height: 16px; color: var(--bk-ink-3); }
.tm-h .who { font-weight: 600; color: var(--bk-ink-1); }
.tm-h .who.you { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 6px; background: var(--bk-sunken); font-size: 11px; }
.tm-b.you { padding: 10px 14px; border-radius: 12px; background: var(--bk-subtle); box-shadow: inset 0 0 0 1px var(--bk-sunken); font-size: 14px; line-height: 22px; white-space: pre-wrap; word-break: break-word; text-wrap: pretty; }
.tm-b.you .fold3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.tm-b.md { padding-left: 28px; }
.tm-a { display: flex; gap: 6px; margin-left: -8px; }
.tm-b.md + .tm-a { margin-left: 20px; }
.tm-h .cp { margin-left: auto; color: var(--bk-ink-3); opacity: 0; transition: opacity .12s; }
.tm:hover .cp, .tm-h .cp:focus-visible { opacity: 1; }
@media (hover: none) { .tm-h .cp { opacity: 1; } }
.tm-b.you .thumbs { margin-top: 8px; }
.tm-ho { display: flex; align-items: center; gap: 12px; font-size: 12px; line-height: 16px; color: var(--bk-ink-3); }
.tm-ho::before, .tm-ho::after { content: ""; flex: 1; border-top: 1px dashed var(--bk-line-strong); }
.tm-more { display: flex; justify-content: center; }
/* 对话历史：右边滑出的侧边栏，专心读完整段对话。你说的靠右、放灰底气泡，它说的靠左、直接排在白底上 */
body.hist-on { overflow: hidden; }
.hist { position: fixed; inset: 0; z-index: 30; display: flex; justify-content: flex-end; }
.hist-scrim { position: absolute; inset: 0; background: var(--bk-scrim); animation: bk-fade .16s ease-out; }
.hist-panel { position: relative; width: min(780px, calc(100vw - 64px)); min-width: 0; display: flex; flex-direction: column; background: var(--bk-surface); box-shadow: var(--bk-e3); animation: bk-slide .2s var(--bk-ease); }
.hist-h { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 14px 16px 14px 24px; border-bottom: 1px solid var(--bk-line); }
.hist-t { flex: 1 1 200px; min-width: 0; }
.hist-t h2 { margin: 0; font-size: 17px; line-height: 24px; font-weight: 600; }
.hist-t p { margin: 0; font-size: 13px; line-height: 20px; color: var(--bk-ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hist-acts { flex: none; max-width: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.hist-links { display: flex; align-items: center; gap: 4px; }
.hist-tools, .hist-foot { flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 16px 8px 24px; }
.hist-tools { flex-wrap: wrap; border-bottom: 1px solid var(--bk-line); }
.hist-tools .search { flex: 1 1 200px; min-width: 0; height: 36px; padding: 0 8px 0 12px; gap: 8px; }
.hist-tools .search input { font-size: 13px; }
.hist-find-nav, .hist-jump, .hm-actions { display: flex; align-items: center; gap: 4px; }
.hist-find-nav .btn, .hist-clear { width: 28px; padding: 0; }
.hist-find-nav .btn:disabled { opacity: .4; cursor: default; }
#hist-find-status { color: var(--bk-ink-3); font: 12px/16px var(--bk-mono); white-space: nowrap; }
#hist-favs[aria-pressed="true"], .hist-star[aria-pressed="true"] { background: var(--bk-sunken); color: var(--bk-ink-1); }
.hist-foot { border-top: 1px solid var(--bk-line); }
.hist-jump { margin-left: auto; }
.hist-content { flex: 1; min-height: 0; display: flex; }
.hist-main { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.hist-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 24px; padding: 16px 24px 48px; }
.hist-body:focus { outline: none; }
.hist-body > * { flex: none; }
.hmsg.you { align-items: flex-end; }
.hmsg.you .tm-h .who { order: 3; }
.hm-actions { margin-left: auto; }
.hmsg.you .hm-actions { order: 1; margin-left: 0; }
.hmsg.you .tm-h > span:not(.who) { order: 2; }
.hmsg.you .tm-b.you { max-width: 86%; border-radius: 14px 14px 4px 14px; background: var(--bk-sunken); box-shadow: none; }
.hmsg.at { margin: -12px; padding: 12px; border-radius: 14px; background: var(--bk-subtle); box-shadow: var(--bk-on); }
.hist-star { width: 28px; padding: 0; color: var(--bk-ink-3); }
.hist-body .hist-current { outline: 2px solid var(--bk-ink-2); outline-offset: 2px; border-radius: 4px; }
.hist-favorites .hist-panel { width: min(1220px, calc(100vw - 40px)); }
.hist-favorites .hist-acts { flex: 0 0 auto; }
.hist-favorites .hist-body { padding: 20px 24px 48px; }
.hist-sessions { flex: 0 0 224px; min-width: 0; overflow-y: auto; overscroll-behavior: contain; padding: 16px 12px; border-right: 1px solid var(--bk-line); background: var(--bk-subtle); }
.hist-sessions h3 { margin: 0 8px 8px; font-size: 13px; line-height: 20px; font-weight: 600; color: var(--bk-ink-3); }
.hist-session { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 8px; align-items: center; width: 100%; min-height: 36px; padding: 8px; border: 0; border-radius: 10px; background: none; color: var(--bk-ink-2); font: inherit; font-size: 13px; line-height: 20px; text-align: left; cursor: pointer; }
.hist-session:hover { background: var(--bk-sunken); }
.hist-session[aria-pressed="true"] { background: var(--bk-surface); box-shadow: var(--bk-on); color: var(--bk-ink-1); font-weight: 600; }
.hist-session-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hist-session-tool, .hist-session-count, .hist-saved-meta { color: var(--bk-ink-3); font-size: 12px; line-height: 16px; }
.hist-session-count { grid-column: 2; grid-row: 1; }
.hist-session-picker { display: none; width: 100%; min-width: 0; min-height: 40px; padding: 0 8px; border: 1px solid var(--bk-line-strong); border-radius: 10px; background: var(--bk-surface); color: var(--bk-ink-1); font: inherit; font-size: 14px; }
.hist-saved-list { display: grid; gap: 20px; }
.hist-saved-total { color: var(--bk-ink-3); font-size: 13px; line-height: 20px; }
.hist-saved-group h3 { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 8px; margin: 0 0 8px; font-size: 15px; line-height: 22px; font-weight: 600; overflow-wrap: anywhere; }
.hist-saved-rows { border: 1px solid var(--bk-line); border-radius: 14px; }
.hist-saved-row { display: grid; width: 100%; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 8px 12px; border: 0; border-radius: 0; background: none; text-align: left; color: var(--bk-ink-1); font: inherit; cursor: pointer; }
.hist-saved-row + .hist-saved-row { border-top: 1px solid var(--bk-line); }
.hist-saved-row:first-child { border-top-left-radius: 13px; border-top-right-radius: 13px; }
.hist-saved-row:last-child { border-bottom-left-radius: 13px; border-bottom-right-radius: 13px; }
.hist-saved-row:hover { background: var(--bk-subtle); }
.hist-saved-row > svg { grid-column: 2; grid-row: 1 / 3; align-self: center; color: var(--bk-ink-3); }
.hist-saved-preview { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; font-size: 14px; line-height: 22px; }
.hist-favorite-bar { flex: none; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 8px; padding: 8px 24px; border-bottom: 1px solid var(--bk-line); }
.hist-saved-detail { padding: 12px; }
.hist-saved-detail + .hist-saved-detail { border-top: 1px solid var(--bk-line); }
.hist-saved-detail-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 8px; margin-bottom: 8px; }
.hist-reader { width: min(100%, 880px); align-self: center; }
.hist-reader-head { margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--bk-line); }
.hist-reader-head h3 { margin: 0 0 4px; font-size: 17px; line-height: 24px; font-weight: 600; overflow-wrap: anywhere; }
.hist-reader .hist-saved-text, .hist-saved-detail .hist-saved-text { font-size: 15px; line-height: 26px; }
.hist-saved-text.tx { white-space: pre-wrap; overflow-wrap: anywhere; }
@media (max-width: 980px) {
  .hist-favorites .hist-panel { width: 100vw; }
  .hist-favorites .hist-content { flex-direction: column; }
  .hist-sessions { flex: none; padding: 8px 16px; border-right: 0; border-bottom: 1px solid var(--bk-line); }
  .hist-sessions h3, .hist-session-list { display: none; }
  .hist-session-picker { display: block; }
}
@media (max-width: 640px) {
  .hist-panel { width: 100vw; }
  .hist-h { padding: 12px 12px 12px 16px; }
  .hist-acts { flex: 1 1 100%; }
  .hist-acts .seg { margin-right: auto; }
  .hist-body { padding: 12px 16px 40px; }
  .hist-tools, .hist-foot { padding: 8px 12px 8px 16px; }
  .hist-favorites .hist-body { padding: 16px 16px 40px; }
  .hist-favorite-bar { padding: 8px 16px; }
  .hist-favorite-bar .btn, .hist-saved-detail-head .btn, #hist-fav-back { min-height: 40px; }
  .hist-tools .search, .hist-find-nav .btn, .hist-clear, .hist-star { min-height: 40px; }
  .hist-find-nav .btn, .hist-clear, .hist-star { width: 40px; }

/* Markdown 排版：它的回复、压缩时的交接 */

/* 我说过的话 */
.history { max-width: 1120px; margin: 0 auto; padding: 28px clamp(16px, 4vw, 40px) 72px; display: flex; flex-direction: column; gap: 24px; }

.hsearch { display: flex; flex-direction: column; gap: 10px; }

mark { background: var(--bk-lime-mark); color: #1B2026; border-radius: 3px; box-shadow: 0 0 0 2px var(--bk-lime-mark); }

            emptyTitle: "最近没有完成的", emptyText: "点了「完成」的会话会在这里留 30 天，也在左栏最下面的「归档」里。" }

const TABS = ["you", "ai", "wait", "inbox"];
const ORDER = { stuck: 0, alarm: 1, wait: 2, review: 3, run: 4, timer: 5, peer: 6, inbox: 7, done: 8 };
const REASON = { stuck: "可能卡住", alarm: "到点了", wait: "等你回话", review: "待你确认完成", run: "在跑",
                 timer: "等时间点", peer: "等同事", inbox: "待整理", done: "已完成 / 不再跟踪" };
// 停在要你点头的地方（approval）：问题、计划、要批准的操作只显示在会话里，看板只知道它在等、看不到内容，所以引导你去会话里处理
const WAITS = {
  question: ["打开会话去回答", "它在会话里问了你一个问题。问题和选项只显示在会话里，看板看不到，打开会话选一项或写下你的回答。"],
  plan: ["打开会话去确认", "计划写好了，在会话里等你确认。打开会话看完计划，同意就批准，要改就直接告诉它。"],
  permission: ["打开会话去批准", "它要执行一个操作，在会话里等你批准。打开会话看清是什么操作，再批准或拒绝。"],
  goal: ["打开会话去确认", "它提了一个目标，在会话里等你确认。打开会话看看，同意就确认，要改就告诉它。"],

function waitOf(it) { return it.kind === "approval" ? WAITS[it.wait] || WAITS.other : null; }
const SNOOZE = [["15m", "15 分钟后"], ["1h", "1 小时后"], ["3h", "3 小时后"], ["tonight", "今晚"], ["tomorrow", "明早"], ["3d", "3 天后"], ["monday", "下周一上午"]];
const NUDGES = ["还在吗？刚才那条看到了吗？", "刚才断了，接着做，先说一声做到哪了"];
const GOAL_ASK = "在下一条回复的状态行上面补一行：🎯 目标：<一句话>｜完成标准：<做到什么算完>";
const WEEK = "日一二三四五六";
const FAV = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><style>.b{fill:#1B2026}.r{stroke:none}@media (prefers-color-scheme:dark){.b{fill:#2C333B}.r{stroke:#fff;stroke-opacity:.18}}</style>' +
  '<rect class="b" width="32" height="32" rx="9"/><rect class="r" x=".5" y=".5" width="31" height="31" rx="8.5" fill="none"/>' +
  '<circle cx="11" cy="16" r="3.4" fill="#CCFB5B"/><path d="M17.7 17.4Q21 12.2 24.3 17.4" fill="none" stroke="#CCFB5B" stroke-width="3.2" stroke-linecap="round"/></svg>';
const FAV_RED = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="#F04C35"/>' +
  '<rect x="8.9" y="10.4" width="4.2" height="8.8" rx="2.1" fill="#fff"/><rect x="18.9" y="10.4" width="4.2" height="8.8" rx="2.1" fill="#fff"/></svg>';

let state = null, failed = false, busy = false;
let view = store("ledger.view") || "you";
if (!TABS.includes(view) && view !== "hidden") view = "you";   // 以前有个「收藏」视图，存着它的回到「轮到你」
if (!VIEWS[view]) view = "you";

let historicTask = null;  // 当前打开的历史详情，独立于近期队列
let hopNow = new Set();
// 左栏筛选：all 全部 / p 一个项目 / t 一个主题 / n 一个项目里没归主题的
let scope = store("ledger.scope") || { t: "all" };
let railOpen = store("ledger.rail") !== false;
const railFold = new Set(store("ledger.fold") || []);   // 收起的项目
let archOpen = store("ledger.arch") === true;            // 左栏「归档」展开着
let src = store("ledger.src") || "all";                  // 只看哪个工具的会话：all / claude / codex
let favOpen = store("ledger.favx") !== true;             // 左栏「收藏的对话」展开着
let outFavsOpen = store("ledger.outfavx") !== true;      // 左栏「收藏的产出物」展开着
const outFavOpen = new Set(store("ledger.outfav.open") || []); // 收藏产出物展开的项目和分类
const outFavEditor = document.getElementById("out-fav-editor");
const outFavFields = outFavEditor.querySelector("form").elements;
let outFavDraft = null;
let autoOpen = store("ledger.autox") !== true;           // 左栏「定时任务」展开着（默认展开）
let autoOff = false;                                     // 「定时任务」里暂停了的那几个展开着
let picker = null;      // 「归到主题」「移到项目」菜单：{ key, q, list }
const prevFace = {};    // 会话 key -> 上次的表情，用来发现「AI 在做 → 待你确认完成」，跳一下
const bubOpen = {};     // 展开全文的气泡
const picks = {};       // 会话 key -> { sig: 这一轮的选项, sel: { 第几件: 第几个选项 }, quick: 第几句, text: 改过的回复, touched: 动过没有 }
const clips = {}; let clipN = 0;

function store(k, v) {
  try { if (v === undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); }
  catch (e) { return null; }
}
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function clip(text) { clips[++clipN] = text; return clipN; }
function domId(key) { return String(key).replace(/[^a-zA-Z0-9]/g, ""); }
function selecting() { return !!String(window.getSelection()); }
function typing() { const el = document.activeElement; return !!(el && el.matches(".reply textarea, .tagpop input, .tagpop select, .menu input, .lfilter, #hist-q")); }
function ime(e) { return e.isComposing || e.keyCode === 229; }   // 中文输入法还在选字：回车是上屏、Esc 是取消，不算提交
function num(n) { return Number(n || 0).toLocaleString("en-US"); }

// ---------------- 时间：按看板的工作时区（服务端给偏移量），写法照文案规范
function nowTs() { return state ? state.now : Date.now() / 1000; }
function tzOff(ts) { return state && state.tzOffsetMin != null ? state.tzOffsetMin * 60 : -new Date(ts * 1000).getTimezoneOffset() * 60; }
function wd(ts) { return new Date((ts + tzOff(ts)) * 1000); }  // 用 getUTC* 读，得到工作时区的日期和钟点
function dayNo(ts) { return Math.floor((ts + tzOff(ts)) / 86400); }
function pad(n) { return (n < 10 ? "0" : "") + n; }
function hm(ts) { const d = wd(ts); return pad(d.getUTCHours()) + ":" + pad(d.getUTCMinutes()); }
function messageTime(ts) {
  const d = wd(ts);
  return d.getUTCFullYear() + "-" + pad(d.getUTCMonth() + 1) + "-" + pad(d.getUTCDate()) + " " + hm(ts);
}
function md(ts) { const d = wd(ts); return (d.getUTCMonth() + 1) + "月" + d.getUTCDate() + "日"; }
function week(ts) { return "周" + WEEK[wd(ts).getUTCDay()]; }
function when(ts) {

  const n = nowTs(), diff = dayNo(ts) - dayNo(n);

  if (diff === -1) return "昨天 " + hm(ts);

function outFavGroups(favs, order) {
  const projects = new Map(), ranks = new Map(order.map((key, i) => [key, i]));
  const types = new Map(CATS.slice(1).concat([["mr", "MR 和流水线"], ["other", "其他产出物"]]));
  const categories = [...types.keys()];
  for (const x of favs) {
    const project = x.projectKey || "其他", type = types.has(x.cat) ? x.cat : "other";
    if (!projects.has(project)) projects.set(project, { key: project, label: x.project || project, count: 0, buckets: new Map() });
    const p = projects.get(project), key = x.topic ? "topic:" + x.topic.id : "cat:" + type;
    if (!p.buckets.has(key)) p.buckets.set(key, { key, label: x.topic ? "# " + x.topic.name : types.get(type),
      rank: x.topic ? -1 : categories.indexOf(type), items: [] });
    p.buckets.get(key).items.push(x);
    p.count++;
  }
  const at = p => ranks.get(p.key) ?? Infinity;
  return [...projects.values()].sort((a, b) => (at(a) - at(b) || 0) || (a.key === "其他") - (b.key === "其他") || a.label.localeCompare(b.label, "zh"))
    .map(p => ({ key: p.key, label: p.label, count: p.count, groups: [...p.buckets.values()]

async function searchOut(q, more) {
  oq = q; oLoaded = true;
  if (tab === "outputs") document.getElementById("q-clear").hidden = !q;
  const off = more ? oItems.length : 0, request = ++oRequest;
  const list = document.getElementById("hlist");
  if (!oReady && tab === "outputs") {
    renderOutFilters();
    document.getElementById("hsum").textContent = "";
    list.innerHTML = '<span class="lmore" role="status">读取产出物…</span>';
  }
  try {
    const r = await fetch("/api/outputs?q=" + encodeURIComponent(q) + "&offset=" + off + (oCat === "all" ? "" : "&cat=" + oCat) +
      (oKey ? "&priority=feishu&key=" + encodeURIComponent(oKey) : ""), { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const res = await r.json();
    if (request !== oRequest) return;  // 快速切换时，晚到的结果不能盖住当前会话
    oItems = more ? oItems.concat(res.items) : res.items;
    oTotal = res.total; oCounts = res.counts || {}; oAll = res.all; oAllSessions = res.allSessions; oWider = res.wider || 0; oWide = !!res.wide;
    if (res.sessionTitle) oSessionTitle = res.sessionTitle;
    if (!more) oPromptHits = res.promptHits || 0;
  } catch (e) {
    if (request !== oRequest) return;
    oLoaded = false;
    if (!oReady && tab === "outputs") list.innerHTML = '<div class="lbar"><span class="lmore" role="status">暂时没取到产出物</span>' +
      btn("重试", "searchOut(oq)", "sec sm") + "</div>";
    else toast("没取到产出物：本机服务没响应");
    return;
  }
  oReady = true;
  if (tab === "outputs") renderOutputs();
}
function setCat(c) { oCat = c; searchOut(oq); }
function widenOut() { oCat = "all"; setOutSession(); }
function goHistory(q) {
  sq = q || ""; hLoaded = false;
  setTab("history");
  window.scrollTo(0, 0);
}
function oKeyTitle() {
  const it = findItem(oKey);
  return it ? it.title : oSessionTitle || "这个会话";
}
function sessLink(x, q, o) {
  // 给出它的会话：在看板上的点一下回到看板，停在它给出这个链接的那一轮；不在了的打开对话历史
  const on = !!findItem(x.key);
  return '<span class="os1">' + toolChip(x) + '<span class="chip sm">' + esc(x.project || "") + '</span><button type="button" class="sl" title="' +
    (on ? "回到看板，定位到它给出这个的那一轮" : "已不在看板上，打开对话历史，定位到它给出这个的那一轮") + '" onclick="goHit(clips[' + clip(x.key) + "],clips[" + clip({ kind: "link", ts: x.ts, url: o.url, text: o.ctx || o.text }) + "],clips[" + clip(x.title || "") + '])">' +
    hl(x.title || "（未命名会话）", q) + "</button></span>";
}
const CAT_NAME = { feishu: "飞书", code: "代码", file: "文件", web: "网页", mr: "MR 和流水线", mr_open: "还开着的 MR", fav: "收藏" };
function orow(o, q) {
  const s0 = o.sessions[0], k0 = s0 ? clip(s0.key) : 0;
  const acts = (s0 ? hitBtn(s0.key, { kind: "link", ts: s0.ts, url: o.url, text: o.ctx || o.text }, s0.title) : "") +
    (s0 ? btn("打开会话" + ico("open", 12), "openSession(clips[" + k0 + "],this)", "ghost xs") : "") +
    (o.cat === "file" && !o.gone && o.twin !== "web" ? btn("在访达里显示", "openFile(clips[" + clip(o.url) + "],true)", "ghost xs") : "") +
    btn(o.cat === "file" ? "复制路径" : "复制链接", "copyClip(" + clip(o.url) + ")", "ghost xs");
  const more = o.nSessions > o.sessions.length ? "<span>等 " + num(o.nSessions) + " 个会话都给过</span>" : "";
  return '<div class="orow' + (o.cat === "mr" && !mrLive(o) ? " done" : "") + (outFavOn(o.key) ? " fav" : "") + '"><span class="ok" title="' + esc(o.name) + '">' +
    esc(o.text !== o.name ? o.name : CAT_NAME[o.cat] || "") + "</span>" +
    '<div class="om">' + outLink(o, "ot" + (o.gone && !o.arch ? " gone" : ""), hl(o.text, q)) + archMark(o) +
    (o.cat === "file" ? '<span class="op">' + hl(o.path || o.url, q) + (o.gone ? (o.arch ? "　原文件已经不在了，点开是看板留档的副本" : "　已经不在了") : o.twin === "file" ? "　原 worktree 已清理，这是主工作区里的同名文件"
      : o.twin === "web" ? "　原 worktree 已清理，点开是仓库默认分支上的版本" : "") + "</span>" : "") +
    (o.ctx ? '<p class="oc" title="AI 给出它时说的话">「' + hl(o.ctx, q) + "」</p>" : "") +
    '<div class="os">' + (MR_STATE[o.state] ? '<span class="chip sm">' + MR_STATE[o.state] + "</span>" : "") + o.sessions.map(x => sessLink(x, q, o)).join("") + more + "</div></div>" +
    '<div class="oa"><span class="ostm">' + outEdit(o) + outStar(o) + '<span class="otm">' + esc(when(o.ts)) + '</span></span><span class="oacts">' + acts + "</span></div></div>";
}
function outCount(cat) {
  return cat === "all" ? CATS.slice(1).reduce((total, [c]) => total + (oCounts[c] || 0), 0) : oCounts[cat] || 0;
}
function renderOutFilters(onlyMr = false) {
  const seg = ([c, label]) => '<button type="button" aria-pressed="' + (onlyMr ? c === "mr" : oCat === c) +
    '" onclick="setCat(\'' + c + "')\">" + label + (oReady ? '<span class="n">' + num(outCount(c)) + "</span>" : "") + "</button>";
  document.getElementById("out-category-filters").innerHTML = CATS.map(seg).join("");
  document.getElementById("out-mr-filters").innerHTML = seg(["mr_open", "还开着的 MR"]) + seg(["mr", "MR 和流水线"]);
  document.getElementById("out-favorite-filter").innerHTML = seg(["fav", "收藏"]);
  const label = oKey ? "只看「" + oKeyTitle() + "」" : "全部会话";
  document.getElementById("out-session-label").textContent = label;
  document.getElementById("out-session-filter").title = "切换会话 · " + label;
  document.getElementById("out-session-clear").hidden = !oKey;
}
function renderOutputs() {
  // oWide：搜的就是某个 MR、流水线，或者产物里没有，把 MR 和流水线也列上了；全是它们时，标签也按它们亮
  const onlyMr = oCat === "all" && oWide && !outCount("all"), mr = oCat === "mr" || oCat === "mr_open" || onlyMr;
  renderOutFilters(onlyMr);
  segCounts(oPromptHits, oTotal);
  document.getElementById("hsum").innerHTML = (oq || oKey || oCat !== "all"
    ? '<span class="mono hit">找到 ' + num(oTotal) + (oCat === "mr_open" ? " 个还开着的 MR" : mr ? " 个 MR 和流水线" : " 个产出物") + "</span>"
    : '<span class="mono">共 ' + num(oAll) + " 个产出物 · 来自 " + num(oAllSessions) + " 个会话</span>") +
    '<span class="note">' + ico("info", 13) + (onlyMr ? "产物里没有，这些是 MR 和流水线：开着的标「待合并」，合并完的变灰"
      : oCat === "all" && oWide ? "搜的是 MR 或流水线，和产物一起列" : oCat === "fav" ? "你点过星标的产出物，也可以在左栏「收藏的产出物」里找"
      : mr ? "临时的：开着的 MR 标「待合并」，合并完的变灰，不用再管"
      : "AI 给你的文档、文件和网页，一直留着；MR 和流水线是临时的，单独放一组") + "</span>";
  let html = "";
  if (!oItems.length) {
    // 只看某个会话或某一类时没搜到：直接说放开后有几个，一键放开；产物里没有、MR 和流水线里有时给那边的入口
    const part = oKey ? "只看「" + oKeyTitle() + "」" + (oCat !== "all" ? "里的" + CAT_NAME[oCat] : "") : oCat !== "all" ? "只看" + CAT_NAME[oCat] : "";
    const inMr = !!(oq && !mr && oCounts.mr);
    const tip = !oq ? (oKey ? "可以切换会话或产出物类型。" : oCat === "fav" ? "点产出物右边的星标，就会加到「收藏的产出物」。" : oCat === "mr_open" ? "合并完、关掉的在「MR 和流水线」里。" : mr ? "AI 在回复里给你 MR 或流水线链接后，会收在这里。" : "AI 在回复里给你链接或文件后，会自动收在这里。")
      : inMr ? "产物里没有，MR 和流水线里有 " + num(oCounts.mr) + " 个对得上。"
      : oWider ? "放开到全部会话、全部类型，有 " + num(oWider) + " 个。"
      : oPromptHits ? "AI 没给过，你自己说过的在上面。"
      : part ? "放开到全部也没有。换个说法，或者少打几个词试试。" : "换个说法，或者少打几个词试试。";
    html += '<div class="dash" style="margin: 0; padding: 20px; gap: 14px">' + face("search", 36) + '<span class="tx">' +
      (oq ? "<b>" + (part ? esc(part) + "时" : "") + "没找到「" + esc(oq) + "」</b>" : "<b>" + (oKey ? "这个会话没有符合当前筛选的产出物" : oCat === "mr_open" ? "开着的 MR 都处理完了" : oCat === "fav" ? "还没有收藏" : "这里还空着") + "</b>") +
      "<span>" + esc(tip) + "</span></span>" +
      (inMr ? btn("去 MR 和流水线里看", "setCat('mr')", "sec sm", "", 'style="margin-left: auto"')
        : oq && oWider ? btn("看全部 " + num(oWider) + " 个", "widenOut()", "sec sm", "", 'style="margin-left: auto"') : "") + "</div>";
    document.getElementById("hlist").innerHTML = html;
    return;
  }
  let day = null;
  oItems.forEach((o, i) => {
    const dn = dayNo(o.ts);
    if (i === 0 || dn !== day) { html += (i ? "</div></section>" : "") + '<section class="day">' + dayHead(o.ts) + '<div class="olist">'; day = dn; }
    html += orow(o, oq);
  });
  html += "</div></section>";
  if (oItems.length < oTotal) html += btn("再加载 100 个", "searchOut(oq, true)", "sec hd", "", 'style="align-self: flex-start"');
  document.getElementById("hlist").innerHTML = html;
}

// ---------------- 事件
document.getElementById("logo-b").innerHTML = face("logo", 28);
document.getElementById("logo-h").innerHTML = face("logo", 32);
document.getElementById("q").addEventListener("input", e => {
  clearTimeout(hTimer);
  document.getElementById("q-clear").hidden = !e.target.value;
  sq = e.target.value.trim();
  hTimer = setTimeout(() => tab === "outputs" ? searchOut(sq) : search(sq), 250);
});
// 点外面关掉菜单和浮层。在里面按下、拖到外面才松手的不算（比如在输入框里往外拖着选字，click 会落在外面）；
// 浮层里的字改过了也不关，要按「保存」/ 回车或「取消」/ Esc
let downIn = null;
document.addEventListener("pointerdown", e => { downIn = e.target; }, true);
document.addEventListener("click", e => {
  const from = sel => e.target.closest(sel) || (downIn && downIn.isConnected && downIn.closest(sel));
  if (menu && !from("#menu")) closeMenu();
  if (tagEdit && !from("#tagpop") && !e.target.closest(".chip") && !popDirty()) closeTag();
  downIn = null;
});
document.addEventListener("keydown", e => {
  if (ime(e) || outFavEditor.open) return;
  if (hist) {   // 对话历史开着：Esc 关掉，⌘K 去搜索，别的键不碰后面的看板
    if (e.key === "Escape") { e.preventDefault(); closeHist(); }
    else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); goSearch(); }
    else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "f") { e.preventDefault(); histQuery.focus(); histQuery.select(); }
    else if (e.target === histQuery && e.key === "Enter") { e.preventDefault(); stepHistMatch(e.shiftKey ? -1 : 1); }
    return;
  }
  if (e.key === "Escape") {
    const inQ = document.activeElement && document.activeElement.id === "q", busyEsc = tagEdit || menu || inQ;
    if (tagEdit) closeTag();
    if (menu) { const el = menu.el; closeMenu(); if (el.isConnected) el.focus(); }
    if (inQ) document.activeElement.blur();
    else if (!busyEsc && tab !== "board") setTab("board");   // 搜索页上没在打字时按 Esc：回看板
    return;
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); goSearch(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey || e.target.closest("input, textarea, select, [contenteditable]")) return;
  if (e.key === "/") { e.preventDefault(); goSearch(); return; }
  if (tab !== "board" || !state) return;
  const k = e.key.toLowerCase(), it = findItem(selKey);
  // [ 收起或展开左栏：按键位认，按着 ⇧ 或开着中文输入法（出来的是 { 或 【）也算
  if ((e.code === "BracketLeft" || (e.key.length === 1 && "[{【「".includes(e.key))) && !e.target.closest("#menu")) { e.preventDefault(); toggleRail(); return; }
  if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("row")) { e.preventDefault(); pick(e.target.dataset.key); return; }
  if (e.target.closest("#menu, button, a")) return;
  if (k === "j") move(1);
  else if (k === "k") move(-1);
  else if (k === "o" && it) openSession(it.key, document.getElementById("open-btn"));
  else if (k === "e" && it && !historicTask && it.group !== "hidden") act(it.key, "done");
  else if (k === "p" && it && !historicTask) togglePin(it.key);
  else if (k === "s" && it && !historicTask && it.group !== "hidden" && faceOf(it) !== "run") openMenu(document.getElementById("snooze-btn"), it.key);
});
["rail", "queue", "detail"].forEach(id => document.getElementById(id).addEventListener("scroll", closeMenu, { passive: true }));
document.getElementById("detail").addEventListener("scroll", spySec, { passive: true });

  histReadTimer = setTimeout(rememberHistPosition, 250);
}, { passive: true });

addEventListener("scroll", spySec, { passive: true });   // 窄屏时详情跟着整页滚
