<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 任务台账</title>
<link rel="icon" id="favicon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* Blink 视觉规范：九成灰阶，颜色只表达状态；实色只给「现在需要你」。数字、时间、短码用等宽。 */
:root {
  --bk-ground: #F5F7F9; --bk-surface: #FFFFFF; --bk-subtle: #F9FAFC; --bk-sunken: #EEF0F3;
  --bk-line: #E0E3E7; --bk-line-strong: #CCD0D5;
  --bk-ink-4: #A0A5AB; --bk-ink-3: #6D7279; --bk-ink-2: #50565D; --bk-ink-1: #1B2026;
  --bk-pri: #1B2026; --bk-pri-hover: #30363D; --bk-pri-active: #0E1115; --bk-pri-text: #FFFFFF;
  --bk-needs: #F04C35; --bk-needs-ink: #BA2D1B; --bk-needs-tint: #FFEFEC; --bk-needs-line: #FFD1C8;
  --bk-run: #3874EA; --bk-run-ink: #235BC8; --bk-run-tint: #EEF5FF; --bk-run-soft: #D8E7FF; --bk-run-line: #CEDFFD;
  --bk-review: #32B36E; --bk-review-ink: #0B7643; --bk-review-tint: #E7FAEC; --bk-review-soft: #CCF3D8; --bk-review-line: #C0EACD;
  --bk-timer: #F3AB2A; --bk-timer-ink: #955816; --bk-timer-tint: #FFF5DC; --bk-timer-soft: #FFEAB8; --bk-timer-line: #FADDA9;
  --bk-peer: #9867E1; --bk-peer-ink: #7444B4; --bk-peer-tint: #F6F2FF; --bk-peer-soft: #EAE0FF; --bk-peer-line: #E3D7FB;
  --bk-lime: #CCFB5B; --bk-lime-mark: #DBFE7D;
  --bk-logo: #1B2026; --bk-logo-rim: transparent; --bk-load-box: #2F363E; --bk-toast: #1B2026;
  --bk-e1: 0 1px 2px rgba(16, 20, 25, .04);
  --bk-e2: 0 6px 16px -6px rgba(16, 20, 25, .12);
  --bk-e3: 0 16px 36px -12px rgba(16, 20, 25, .22), 0 2px 6px rgba(16, 20, 25, .06);
  --bk-e-toast: 0 16px 36px -12px rgba(16, 20, 25, .4), 0 2px 6px rgba(16, 20, 25, .12);
  --bk-on: 0 1px 2px rgba(16, 20, 25, .06), 0 0 0 1px rgba(16, 20, 25, .06);
  --bk-ring: rgba(27, 32, 38, .08);
  --bk-ease: cubic-bezier(.2, .8, .2, 1);
  --bk-sans: "Geist", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
  --bk-mono: "Geist Mono", "SF Mono", Menlo, Consolas, "PingFang SC", "Noto Sans CJK SC", monospace;
  color-scheme: light;
}
/* 深色：规范只画了浅色，这里按同一套 token 换明度，结构不变 */
@media (prefers-color-scheme: dark) {
  :root {
    --bk-ground: #0F1215; --bk-surface: #171B20; --bk-subtle: #1A1F24; --bk-sunken: #22272E;
    --bk-line: #2B3139; --bk-line-strong: #3B424B;
    --bk-ink-4: #5D646C; --bk-ink-3: #979DA4; --bk-ink-2: #B9BEC4; --bk-ink-1: #ECEEF1;
    --bk-pri: #ECEEF1; --bk-pri-hover: #D6DADF; --bk-pri-active: #C4C9CF; --bk-pri-text: #14181C;
    --bk-needs-ink: #FF8D7C; --bk-needs-tint: rgba(240, 76, 53, .14); --bk-needs-line: rgba(240, 76, 53, .36);
    --bk-run-ink: #8EB5FF; --bk-run-tint: rgba(56, 116, 234, .14); --bk-run-soft: #22375C; --bk-run-line: rgba(56, 116, 234, .36);
    --bk-review-ink: #71D79D; --bk-review-tint: rgba(50, 179, 110, .14); --bk-review-soft: #1C3D2A; --bk-review-line: rgba(50, 179, 110, .36);
    --bk-timer-ink: #F4C56C; --bk-timer-tint: rgba(243, 171, 42, .14); --bk-timer-soft: #45341A; --bk-timer-line: rgba(243, 171, 42, .36);
    --bk-peer-ink: #C3A5F6; --bk-peer-tint: rgba(152, 103, 225, .16); --bk-peer-soft: #352850; --bk-peer-line: rgba(152, 103, 225, .38);
    --bk-logo: #2C333B; --bk-logo-rim: rgba(255, 255, 255, .18); --bk-load-box: #1B2026; --bk-toast: #2A3038;
    --bk-e1: 0 1px 2px rgba(0, 0, 0, .3);
    --bk-e2: 0 6px 16px -6px rgba(0, 0, 0, .5);
    --bk-e3: 0 16px 36px -12px rgba(0, 0, 0, .6), 0 2px 6px rgba(0, 0, 0, .3);
    --bk-e-toast: 0 16px 36px -12px rgba(0, 0, 0, .7), 0 0 0 1px rgba(255, 255, 255, .06);
    --bk-on: 0 1px 2px rgba(0, 0, 0, .4), 0 0 0 1px rgba(255, 255, 255, .07);
    --bk-ring: rgba(236, 238, 241, .12);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bk-ground); color: var(--bk-ink-1); font: 14px/22px var(--bk-sans); -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
a { color: var(--bk-run-ink); }
a:hover { color: var(--bk-ink-1); }
a:focus-visible, button:focus-visible { outline: 2px solid var(--bk-ink-1); outline-offset: 2px; }
[hidden] { display: none !important; }
.mono { font-family: var(--bk-mono); }

/* 小表情与动效：每种状态最多一个动作；系统「减少动态效果」时全部静止 */
@keyframes bk-blink { 0%, 90%, 100% { transform: scaleY(1); } 93% { transform: scaleY(.12); } 96% { transform: scaleY(1); } }
@keyframes bk-scan { 0%, 100% { transform: translateX(-1.6px); } 45%, 55% { transform: translateX(1.6px); } }
@keyframes bk-doze { 0% { opacity: 0; transform: translate(0, 1px); } 30% { opacity: 1; } 100% { opacity: 0; transform: translate(1.5px, -2.5px); } }
@keyframes bk-hop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@keyframes bk-rise { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
@keyframes bk-drop { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
.bk-blink { transform-box: fill-box; transform-origin: center; animation: bk-blink 5.2s infinite; }
.bk-scan { animation: bk-scan 2.6s cubic-bezier(.45, 0, .55, 1) infinite; }
.bk-doze { animation: bk-doze 3.2s ease-out infinite; }
.bk-hop { animation: bk-hop .24s var(--bk-ease) 1; }
.face { flex: none; display: block; }
.face.faded { opacity: .55; }
@media (prefers-reduced-motion: reduce) {
  .bk-blink, .bk-scan, .bk-doze, .bk-hop, .menu, .toast, .tagpop { animation: none !important; }
  * { transition: none !important; }
}

/* 按钮：主 = 墨色实底（一个区域最多一个），次 = 白底描边，幽灵 = 无底悬停变灰 */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 12px;
  border: 1px solid transparent; border-radius: 10px; background: transparent; color: var(--bk-ink-2);
  font-size: 13px; font-weight: 500; line-height: 20px; white-space: nowrap; text-decoration: none; cursor: pointer;
  transition: background-color .12s, border-color .12s, color .12s, transform .12s;
}
.btn:active { transform: scale(.98); }
.btn.pri { padding: 0 14px; background: var(--bk-pri); color: var(--bk-pri-text); font-weight: 600; }
.btn.pri:hover { background: var(--bk-pri-hover); color: var(--bk-pri-text); }
.btn.pri:active { background: var(--bk-pri-active); }
.btn.sec { background: var(--bk-surface); border-color: var(--bk-line); color: var(--bk-ink-1); }
.btn.sec:hover { background: var(--bk-ground); border-color: var(--bk-line-strong); }
.btn.ghost:hover, .btn.ghost.on { background: var(--bk-sunken); color: var(--bk-ink-1); }
.btn.loading { pointer-events: none; padding-left: 10px; gap: 8px; }
.btn.hd { height: 32px; }
.btn.sm { height: 30px; padding: 0 8px; }
.btn.xs { height: 28px; padding: 0 8px; border-radius: 8px; font-size: 12px; }
.btn.icon { width: 32px; height: 32px; padding: 0; border-radius: 8px; }
.btn svg { flex: none; }

/* 标签与徽标：只有理由标签和红色计数带颜色，其余全灰 */
.chip {
  flex: none; display: inline-flex; align-items: center; max-width: 14em; height: 20px; padding: 0 6px; border: 0; border-radius: 6px;
  background: var(--bk-sunken); color: var(--bk-ink-2); font: 600 11px/20px var(--bk-mono); letter-spacing: .02em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.chip.sm { height: 18px; padding: 0 5px; border-radius: 5px; font-size: 10.5px; line-height: 18px; }
button.chip { cursor: pointer; transition: box-shadow .12s; }
button.chip:hover { box-shadow: inset 0 0 0 1px var(--bk-ink-1); }
.count { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; font: 600 11px/18px var(--bk-mono); }
.count.hot { background: var(--bk-needs); color: #FFFFFF; }
kbd.k {
  display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 4px;
  border: 1px solid var(--bk-line-strong); border-bottom-width: 2px; border-radius: 4px; background: var(--bk-surface);
  color: var(--bk-ink-2); font: 10.5px/1 var(--bk-mono);
}
kbd.k.md { min-width: 20px; height: 20px; padding: 0 5px; border-radius: 5px; font-size: 11px; }
kbd.k.lg { min-width: 22px; height: 22px; padding: 0 6px; border-radius: 6px; font-size: 12px; }

/* 页头 */
.brand { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; min-width: 0; }
.brand h1 { margin: 0; font-size: 16px; line-height: 22px; font-weight: 600; }
.brand .stack { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.metam { font: 12px/16px var(--bk-mono); color: var(--bk-ink-3); }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.btn.sec.searchbtn { justify-content: flex-start; gap: 8px; width: 280px; max-width: 100%; padding: 0 8px 0 10px; color: var(--bk-ink-3); font-weight: 400; }
.searchbtn span { flex: 1; text-align: left; }
.vsep { width: 1px; height: 18px; background: var(--bk-line); }
.sync { display: inline-flex; align-items: center; gap: 6px; padding: 0 2px 0 4px; font: 12px/16px var(--bk-mono); color: var(--bk-ink-3); }
.sync .dot { width: 6px; height: 6px; border-radius: 999px; background: var(--bk-review); }
.sync.busy { color: var(--bk-ink-2); }
.sync.bad { color: var(--bk-needs-ink); }

/* 看板：左边队列，右边详情 */
.board { display: flex; flex-direction: column; min-height: 100vh; }
.bhead { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; padding: 12px clamp(16px, 2vw, 24px); }
.split { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: stretch; border-top: 1px solid var(--bk-line); }
.queue { flex: 0 1 420px; min-width: 0; padding: 16px 12px; border-right: 1px solid var(--bk-line); display: flex; flex-direction: column; gap: 14px; }
.detail { flex: 999 1 540px; min-width: 0; padding: 24px clamp(16px, 3vw, 44px) 40px; background: var(--bk-surface); }
.detail-in { width: 100%; max-width: 900px; min-height: 100%; display: flex; flex-direction: column; gap: 26px; }
@media (min-width: 961px) {
  .board { height: 100vh; height: 100dvh; min-height: 0; }
  .split { flex-wrap: nowrap; min-height: 0; }
  .queue, .detail { overflow-y: auto; overscroll-behavior: contain; }
}
@media (max-width: 960px) {
  .queue { flex-basis: 100%; border-right: 0; border-bottom: 1px solid var(--bk-line); }
}

.tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; padding: 3px; border-radius: 12px; background: var(--bk-sunken); }
.tab {
  display: flex; align-items: center; justify-content: center; gap: 6px; min-width: 0; height: 34px; padding: 0 6px;
  border: 0; border-radius: 9px; background: transparent; color: var(--bk-ink-2); font-size: 13px; font-weight: 500;
  white-space: nowrap; cursor: pointer; transition: color .12s;
}
.tab:hover { color: var(--bk-ink-1); }
.tab[aria-selected="true"] { background: var(--bk-surface); color: var(--bk-ink-1); font-weight: 600; box-shadow: var(--bk-on); }
.tab .n { font: 500 12px/1 var(--bk-mono); color: var(--bk-ink-3); }
.qhint { margin: 0; padding: 0 8px; font-size: 13px; line-height: 20px; color: var(--bk-ink-3); }
.qgroup { display: flex; flex-direction: column; gap: 2px; }
.qlabel { padding: 2px 10px 4px; font-size: 12px; line-height: 16px; color: var(--bk-ink-3); }
.row {
  display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 3px 10px; align-items: center; width: 100%; padding: 10px;
  border: 0; border-radius: 12px; background: transparent; color: var(--bk-ink-1); text-align: left; cursor: pointer;
  transition: background-color .12s;
}
.row:hover, .row[aria-current="true"] { background: var(--bk-surface); }
.row[aria-current="true"] { box-shadow: var(--bk-on); }
.row .fc { grid-row: span 2; align-self: start; display: flex; padding-top: 1px; }
.row .t { min-width: 0; font-size: 14px; line-height: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .w { font: 500 12px/20px var(--bk-mono); color: var(--bk-ink-2); white-space: nowrap; }
.row .w.hot { color: var(--bk-needs-ink); }
.row .s { grid-column: 2 / 4; display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 13px; line-height: 18px; color: var(--bk-ink-3); }
.row .s > span:last-child { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dash { display: flex; align-items: center; gap: 12px; margin: 0 4px; padding: 16px; border: 1px dashed var(--bk-line-strong); border-radius: 14px; }
.dash .tx { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.dash b { font-size: 14px; line-height: 20px; font-weight: 600; }
.dash .tx span { font-size: 13px; line-height: 20px; color: var(--bk-ink-3); }
.dash.card { flex-direction: column; align-items: flex-start; gap: 10px; padding: 14px; background: var(--bk-surface); }
.dash.card > span { font-size: 13px; line-height: 20px; color: var(--bk-ink-2); }
.qfoot { margin-top: auto; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding-top: 4px; }
.kbd-hints { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 8px 8px 0; font-size: 12px; line-height: 20px; color: var(--bk-ink-3); }
.kbd-hints span { display: inline-flex; align-items: center; gap: 4px; }

/* 详情 */
.dhead { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 14px 16px; }
.dtitle { flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.dtitle h2 { margin: 0; font-size: 22px; line-height: 30px; font-weight: 600; letter-spacing: -.01em; word-break: break-word; }
.dmeta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font: 12px/18px var(--bk-mono); color: var(--bk-ink-3); }
.dacts { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.mwrap { position: relative; }
.menu {
  position: absolute; top: calc(100% + 6px); right: 0; z-index: 10; width: 240px; padding: 6px; display: flex; flex-direction: column; gap: 2px;
  border: 1px solid var(--bk-line); border-radius: 14px; background: var(--bk-surface); box-shadow: var(--bk-e3); animation: bk-drop .14s var(--bk-ease);
}
.menu .ml { padding: 6px 10px 4px; font-size: 12px; line-height: 16px; color: var(--bk-ink-3); }
.menu button {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 36px; padding: 0 10px;
  border: 0; border-radius: 8px; background: transparent; color: var(--bk-ink-1); font-size: 13px; cursor: pointer;
}
.menu button:hover, .menu button:focus-visible { background: var(--bk-ground); }
.menu button span:last-child { font: 12px var(--bk-mono); color: var(--bk-ink-3); }
.why { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: var(--bk-ground); font-size: 13px; line-height: 20px; color: var(--bk-ink-2); }
.why svg { flex: none; margin-top: 2px; color: var(--bk-ink-3); }
.why b { color: var(--bk-ink-1); font-weight: 600; }
.part { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.part.tight { gap: 6px; }
.sec-t { font-size: 15px; line-height: 22px; font-weight: 600; }
.sec-l { font-size: 12px; line-height: 16px; color: var(--bk-ink-3); }
.sec-hd { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.sec-hd .mono { font-size: 12px; color: var(--bk-ink-3); }
.now { margin: 0; font-size: 17px; line-height: 28px; text-wrap: pretty; word-break: break-word; }

/* 待你决定：点选项拼成一条回复，只复制、打开会话，由你自己粘贴发出去（不替你发，见 AGENTS.md 设计原则） */
.dlist { display: flex; flex-direction: column; gap: 1px; border: 1px solid var(--bk-line); border-radius: 14px; background: var(--bk-sunken); overflow: hidden; }
.dq { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 12px 10px 14px; background: var(--bk-surface); }
.dq .n { flex: none; width: 16px; font: 12px/20px var(--bk-mono); color: var(--bk-ink-3); }
.dq .q { flex: 1 1 220px; min-width: 0; font-size: 14px; line-height: 21px; word-break: break-word; }
.dq .opts { display: flex; flex-wrap: wrap; gap: 6px; }
.opt {
  min-height: 30px; padding: 4px 12px; border: 1px solid var(--bk-line); border-radius: 8px; background: var(--bk-surface);
  color: var(--bk-ink-1); font-size: 13px; line-height: 20px; font-weight: 500; text-align: left; cursor: pointer; transition: border-color .12s;
}
.opt:hover { border-color: var(--bk-ink-1); }
.opt[aria-pressed="true"] { border-color: var(--bk-pri); background: var(--bk-pri); color: var(--bk-pri-text); }
.opt.lg { min-height: 34px; padding: 6px 12px; border-radius: 10px; font-weight: 400; }
.opts-row { display: flex; flex-wrap: wrap; gap: 8px; }
.reply { display: flex; flex-direction: column; gap: 10px; padding: 12px 12px 12px 14px; border: 1px solid var(--bk-line-strong); border-radius: 14px; box-shadow: var(--bk-e1); }
.rpre { margin: 0; min-height: 44px; font-size: 14px; line-height: 22px; white-space: pre-wrap; word-break: break-word; }
.rpre.ph { color: var(--bk-ink-3); }
.reply textarea {
  display: block; width: 100%; min-height: 56px; padding: 8px 12px; resize: vertical; border: 1px solid var(--bk-line); border-radius: 12px;
  background: var(--bk-surface); font-size: 13px; line-height: 20px; outline: none; transition: border-color .12s, box-shadow .12s;
}
.reply textarea::placeholder { color: var(--bk-ink-3); }
.reply textarea:focus { border-color: var(--bk-ink-1); box-shadow: 0 0 0 4px var(--bk-ring); }
.rfoot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
.rfoot .rh { font-size: 12px; line-height: 18px; color: var(--bk-ink-3); }
.rfoot .bs { display: flex; gap: 6px; }

/* 对话 */
.convo { display: flex; flex-direction: column; gap: 12px; }
.msg { display: flex; flex-direction: column; gap: 4px; }
.msg .ml { font-size: 12px; line-height: 16px; color: var(--bk-ink-3); }
.bub { padding: 10px 14px; font-size: 14px; line-height: 22px; white-space: pre-wrap; word-break: break-word; text-wrap: pretty; }
.bub .clamp { display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
.msg.you { align-self: flex-end; align-items: flex-end; max-width: 84%; }
.msg.you .bub { border-radius: 14px 14px 4px 14px; background: var(--bk-sunken); }
.msg.it { align-self: flex-start; flex-direction: row; gap: 10px; max-width: 90%; }
.msg.it > .face { margin-top: 20px; }
.msg.it .col { min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.msg.it .bub { border: 1px solid var(--bk-line); border-radius: 14px 14px 14px 4px; background: var(--bk-surface); }

.goal { margin: 0; font-size: 14px; line-height: 22px; white-space: pre-wrap; word-break: break-word; }
.goal-sub { font-size: 13px; line-height: 20px; color: var(--bk-ink-2); white-space: pre-wrap; word-break: break-word; }
.pill { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; margin-left: 8px; border-radius: 6px; background: var(--bk-sunken); color: var(--bk-ink-2); font-size: 12px; font-weight: 600; vertical-align: 1px; }

<script>
const TOKEN = "__LEDGER_TOKEN__";
// 队列的四个视图（外加「已完成」），groups 是服务端 GROUPS 的 id
const VIEWS = {
  you: { label: "轮到你", groups: ["need", "confirm"], hint: "球在你这边。卡住 > 到点 > 等你回话，同类里等得久的在前。",
         emptyTitle: "没有要你拍板的事", emptyText: "AI 们在安静干活，有新情况会自己跳到这里。" },
  ai: { label: "AI 在做", groups: ["ai"], hint: "正在跑，不用盯 · 需要你的时候会自己挪到「轮到你」",
        emptyTitle: "没有在跑的任务", emptyText: "手上闲着，随时可以交代新活。" },
  wait: { label: "在等", groups: ["time", "peer"], hint: "推迟的、等到点的、等同事的都在这里，到点自己回来。",
          emptyTitle: "没有在等的事", emptyText: "推迟或者等同事的会话会出现在这里。" },
  inbox: { label: "待整理", groups: ["backlog"], hint: "没写状态行，或很久没动静的会话。看一眼，没用了就点「完成」。",
           emptyTitle: "都整理完了", emptyText: "新会话没写状态行时会先放在这里。" },
  hidden: { label: "已完成", groups: [], hint: "",
            emptyTitle: "最近没有完成的", emptyText: "点了「完成」的会话会在这里留一阵，方便恢复。" }
};
const TABS = ["you", "ai", "wait", "inbox"];
const ORDER = { stuck: 0, alarm: 1, wait: 2, review: 3, run: 4, timer: 5, peer: 6, inbox: 7, done: 8 };
const REASON = { stuck: "可能卡住", alarm: "到点了", wait: "等你回话", review: "待你确认完成", run: "在跑",
                 timer: "等时间点", peer: "等同事", inbox: "待整理", done: "已完成 / 不再跟踪" };
const SNOOZE = [["15m", "15 分钟后"], ["1h", "1 小时后"], ["3h", "3 小时后"], ["tonight", "今晚"], ["tomorrow", "明早"], ["monday", "下周一上午"]];
const NUDGES = ["还在吗？刚才那条看到了吗？", "刚才断了，接着做，先说一声做到哪了"];
const GOAL_ASK = "在下一条回复的状态行上面补一行：🎯 目标：<一句话>｜完成标准：<做到什么算完>";
const WEEK = "日一二三四五六";
const FAV = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><style>.b{fill:#1B2026}.r{stroke:none}@media (prefers-color-scheme:dark){.b{fill:#2C333B}.r{stroke:#fff;stroke-opacity:.18}}</style>' +
  '<rect class="b" width="32" height="32" rx="9"/><rect class="r" x=".5" y=".5" width="31" height="31" rx="8.5" fill="none"/>' +
  '<circle cx="11" cy="16" r="3.4" fill="#CCFB5B"/><path d="M17.7 17.4Q21 12.2 24.3 17.4" fill="none" stroke="#CCFB5B" stroke-width="3.2" stroke-linecap="round"/></svg>';
const FAV_RED = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="#F04C35"/>' +
  '<rect x="8.9" y="10.4" width="4.2" height="8.8" rx="2.1" fill="#fff"/><rect x="18.9" y="10.4" width="4.2" height="8.8" rx="2.1" fill="#fff"/></svg>';

let state = null, failed = false, busy = false;
let view = store("ledger.view") || "you";
if (!VIEWS[view]) view = "you";
let selKey = null, selIdx = 0, menuOpen = false, iconRed = null;
let hopNow = new Set();
const prevFace = {};    // 会话 key -> 上次的表情，用来发现「AI 在做 → 待你确认完成」，跳一下
const bubOpen = {};     // 展开全文的气泡
const picks = {};       // 会话 key -> { sig: 这一轮的选项, sel: { 第几件: 第几个选项 }, quick: 第几句, note: 补充 }
const clips = {}; let clipN = 0;

function store(k, v) {
  try { if (v === undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); }
  catch (e) { return null; }
}
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function clip(text) { clips[++clipN] = text; return clipN; }
function domId(key) { return String(key).replace(/[^a-zA-Z0-9]/g, ""); }
function selecting() { return !!String(window.getSelection()); }
function typing() { const el = document.activeElement; return !!(el && el.matches(".reply textarea, .tagpop input")); }
function num(n) { return Number(n || 0).toLocaleString("en-US"); }

// ---------------- 时间：按看板的工作时区（服务端给偏移量），写法照文案规范
function nowTs() { return state ? state.now : Date.now() / 1000; }
function tzOff(ts) { return state && state.tzOffsetMin != null ? state.tzOffsetMin * 60 : -new Date(ts * 1000).getTimezoneOffset() * 60; }
function wd(ts) { return new Date((ts + tzOff(ts)) * 1000); }  // 用 getUTC* 读，得到工作时区的日期和钟点
function dayNo(ts) { return Math.floor((ts + tzOff(ts)) / 86400); }
function pad(n) { return (n < 10 ? "0" : "") + n; }
function hm(ts) { const d = wd(ts); return pad(d.getUTCHours()) + ":" + pad(d.getUTCMinutes()); }
function md(ts) { const d = wd(ts); return (d.getUTCMonth() + 1) + "月" + d.getUTCDate() + "日"; }
function week(ts) { return "周" + WEEK[wd(ts).getUTCDay()]; }
function when(ts) {
  // 今天只写钟点；昨天、明天、7 天内写周几；更早只写日期，跨年加年份；将来的时间都带钟点
  const n = nowTs(), diff = dayNo(ts) - dayNo(n);
  if (diff === 0) return hm(ts);
  if (diff === -1) return "昨天 " + hm(ts);
  if (diff === 1) return "明天 " + hm(ts);
  if (Math.abs(diff) < 7) return week(ts) + " " + hm(ts);
  const y = wd(ts).getUTCFullYear() !== wd(n).getUTCFullYear() ? wd(ts).getUTCFullYear() + "年" : "";
  return y + md(ts) + (ts > n ? " " + hm(ts) : "");
}
function dur(sec) {
  sec = Math.max(0, sec);
  if (sec < 60) return "刚刚";
  if (sec < 3600) return Math.floor(sec / 60) + " 分钟";
  if (sec < 86400) { const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60); return h + " 小时" + (m ? " " + m + " 分" : ""); }
  const d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600);
  return d + " 天" + (h ? " " + h + " 小时" : "");
}
function waited(sec) { return sec < 60 ? "刚刚" : "等了 " + dur(sec); }

// ---------------- 图标与小表情（24 画布，脸占 22，圆角 7；眼睛位置不变，只换形状）
const ICONS = {
  open: '<path d="M7 17 17 7"/><path d="M7 7h10v10"/>', down: '<path d="m6 9 6 6 6-6"/>', up: '<path d="m18 15-6-6-6 6"/>',
  check: '<path d="M20 6 9 17l-5-5"/>', info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5v.5"/>',
  warn: '<circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5v.5"/>', send: '<path d="M5 12h13"/><path d="m13 6 6 6-6 6"/>',
  copy: '<rect x="8.5" y="8.5" width="12" height="12" rx="2.5"/><path d="M15.5 8.5V6a2.5 2.5 0 0 0-2.5-2.5H6A2.5 2.5 0 0 0 3.5 6v7A2.5 2.5 0 0 0 6 15.5h2.5"/>'

// ---------------- 会话 → 表情、理由、时长
function faceOf(it) {
  const g = it.group, k = it.kind;
  if (g === "need") return k === "interrupted" || k === "sched_failed" ? "stuck" : k === "time" || k === "peer" ? "alarm" : "wait";
  return { confirm: "review", ai: "run", time: "timer", peer: "peer", backlog: "inbox", hidden: "done" }[g] || "inbox";
}
function snoozed(it) { return !!it.snoozed || /^推迟到/.test(it.headline); }
function dueOf(it) { return it.sort > 1e9 && it.sort < nowTs() + 365 * 86400 ? it.sort : 0; }  // 等时间点、等同事按到点时间排序
function reasonOf(it) {
  const f = faceOf(it);
  if (it.kind === "sched_failed") return "唤醒没执行";
  if (f === "alarm" && it.kind === "peer") return "该跟进了";
  if (f === "timer") return snoozed(it) ? "推迟了" : it.kind === "sched" ? "已定时" : "等时间点";
  if (f === "inbox") return it.badges[0] || "待整理";
  if (f === "done") return it.headline || "已完成";
  return REASON[f];
}
function rowTime(it) {
  const f = faceOf(it), n = nowTs();
  if (f === "run") return it.since && n - it.since < 86400 ? (n - it.since < 60 ? "刚开始" : "已跑 " + dur(n - it.since)) : "在跑";
  if ((f === "timer" || f === "peer") && dueOf(it)) return when(dueOf(it));
  if (f === "inbox" || f === "done") return when(it.last);
  return dur(it.idle);
}
function whyOf(it) {
  const f = faceOf(it), k = it.kind;
  if (k === "sched_failed") return "定时唤醒没能把话发回会话。打开会话手动接着做，原因看下面的现状。";
  if (f === "stuck") return "它这一轮停在半路，超过 " + ((state && state.interruptedMin) || 30) + " 分钟没动静。可能在等一个没弹出来的确认，也可能已经中断。";
  if (f === "alarm") return k === "peer" ? "和同事约好的跟进时间到了。" : "你设的提醒到点了。到点的事排在等回话的前面。";
  if (f === "wait") return k === "approval" ? "它停在一个要你点头的地方：一个问题、一份计划，或一个操作。" : "它最后的状态行写的是「等你」，球在你这边。";
  if (f === "review") return "它说已经达到完成标准。你看过没问题，点「完成」才算数。";
  if (f === "run") return "它在处理你交代的事，还没停下来问你。需要你的时候会自己挪到「轮到你」。";
  if (f === "timer") return snoozed(it) ? "你推迟了它，到点之前不会再打扰你。" : k === "sched" ? "它安排了到点自己接着做，到时候会自动唤醒会话。" : "要你本人到点去做的事。到点会挪到「轮到你」，并弹 Mac 通知。";
  if (f === "peer") return "在等同事。到了约定再跟的时间，会挪到「轮到你」。";
  if (f === "inbox") return it.badges[0] === "状态不明" ? "它最后的回复没写状态行，台账猜不出该归哪。"
    : "超过 " + ((state && state.staleHours) || 48) + " 小时没动静了。还要做就打开会话接着说，没用了就点「完成」。";
  return "再和这个会话说话，它会自动回到看板。";
}
function badgeOf(it) {
  const f = faceOf(it), bits = [reasonOf(it)];
  if (f === "stuck" || f === "alarm" || f === "wait" || f === "review") bits.push(waited(it.idle));
  else if (f === "run") bits.push(rowTime(it));
  else if ((f === "timer" || f === "peer") && dueOf(it)) bits.push(when(dueOf(it)) + (snoozed(it) ? " 再叫你" : ""));
  else if (f === "inbox" && it.badges[0] === "状态不明") bits.push("最后动静 " + when(it.last));
  return bits.concat(it.badges.filter((b, i) => !(f === "inbox" && i === 0) && !/待你决定$/.test(b))).join(" · ");
}
function decisionsOf(it) { return it.group !== "hidden" && it.details && it.details.decisions || []; }
function shortOf(it) { const n = decisionsOf(it).length; return n ? n + " 件事等你决定" : it.headline; }

// ---------------- 数据
function allItems(s) { return s ? s.groups.reduce((a, g) => a.concat(g.items), []).concat(s.hidden) : []; }
function findItem(key) { return key ? allItems(state).find(it => it.key === key) || null : null; }
function viewItems(v) {
  if (!state) return [];
  if (v === "hidden") return state.hidden.slice();
  const out = state.groups.filter(g => VIEWS[v].groups.includes(g.id)).reduce((a, g) => a.concat(g.items), []);
  // 先按理由排，同类保持服务端的顺序（等得久的、先到点的在前）
  return out.map((it, i) => [it, i]).sort((a, b) => ORDER[faceOf(a[0])] - ORDER[faceOf(b[0])] || a[1] - b[1]).map(x => x[0]);
}
function needCount() { const g = state && state.groups.find(x => x.id === "need"); return g ? g.items.length : 0; }

async function load(refresh) {
  try {
    const r = await fetch("/api/state" + (refresh ? "?refresh=" + refresh : ""), { cache: "no-store" });
    const next = await r.json();
    failed = false;
    hopNow = new Set();
    allItems(next).forEach(it => {
      const f = faceOf(it);
      if (prevFace[it.key] === "run" && f === "review") hopNow.add(it.key);
      prevFace[it.key] = f;
    });
    state = next;
    if (selecting() || typing()) return renderTop();  // 正在选中文字或打字时先不重画列表，下次刷新再画
    render();
    hopNow.clear();
  } catch (e) {
    failed = true;
    renderTop();
  }
}
async function refresh() {
  busy = true; renderTop();
  await load("force");
  busy = false; renderTop();
  if (tab === "history") search(hq);
}
async function post(action, key, arg) {
  const r = await fetch("/api/action", {
    method: "POST", headers: { "Content-Type": "application/json", "X-Ledger-Token": TOKEN },
    body: JSON.stringify({ key, action, arg })
  });
  return r.json();
}
async function act(key, action, arg) {
  menuOpen = false;
  try {
    const res = await post(action, key, arg);
    const undo = res.ok && (action === "done" || action === "untrack" || action === "snooze") && !Array.isArray(arg);
    let msg = res.message || (res.ok ? "好了" : "没成功"), fc = null;
    if (res.ok && action === "done" && !Array.isArray(arg)) { msg = "完成了，已移出看板"; fc = "review"; }
    if (res.ok && action === "snooze") { msg = "好，" + snoozeAt(arg) + " 再叫你"; fc = "timer"; }
    toast(msg, undo ? () => act(key, "restore") : null, fc);
  } catch (e) { toast("操作失败：本机服务没响应"); }
  load();
}
async function openSession(key, el) {
  const html = el ? el.innerHTML : "";
  if (el) { el.classList.add("loading"); el.innerHTML = face("load", 16) + "打开中…"; }
  try {
    const res = await post("open", key);
    toast(res.message || (res.ok ? "已打开" : "没打开"));
  } catch (e) { toast("打开失败：本机服务没响应"); }
  if (el && el.isConnected) { el.classList.remove("loading"); el.innerHTML = html; }
}
async function copyClip(id, msg) {
  try { await navigator.clipboard.writeText(clips[id]); toast(msg || "已复制"); } catch (e) { toast("复制失败，请手动选中"); }
}
async function copyOpen(text, key) {
  try { await navigator.clipboard.writeText(text); } catch (e) { toast("复制失败，请手动选中"); return; }
  if (!key) return toast("已复制");
  try {
    const res = await post("open", key);
    toast(res.ok ? "已复制。" + res.message + "，在输入框按 ⌘V 再回车" : "已复制，但没打开会话：" + (res.message || "没成功"));
  } catch (e) { toast("已复制，但没打开会话：本机服务没响应"); }
}

let toastTimer = null;
function toast(msg, undo, fc) {
  const el = document.getElementById("toast");
  el.className = "toast" + (fc ? " f" : "") + (undo ? " u" : "");
  el.innerHTML = (fc ? face(fc, 22) : "") + '<span class="tm">' + esc(msg) + "</span>" + (undo ? '<button type="button" id="undo">撤销</button>' : "");
  el.hidden = false;
  el.style.animation = "none"; void el.offsetWidth; el.style.animation = "";
  if (undo) document.getElementById("undo").onclick = () => { el.hidden = true; undo(); };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 5000);
}

function btn(label, onclick, cls, title, attrs) {
  return '<button type="button" class="btn ' + (cls || "") + '"' + (title ? ' title="' + esc(title) + '"' : "") + (attrs ? " " + attrs : "") +
    ' onclick="event.stopPropagation();' + onclick + '">' + label + "</button>";
}
function tagChip(x) {
  return '<button type="button" class="chip" title="点一下改这个项目的短码" data-p="' + esc(x.projectKey) + '" data-l="' + esc(x.project) +
    '" data-c="' + esc(x.color) + '" onclick="event.stopPropagation();editTag(this)">' + esc(x.project) + "</button>";
}
function linkList(links) {
  return '<ul class="links">' + links.map(l =>
    '<li><span class="lk">' + esc(l.label ? l.name : "") + '</span><a href="' + esc(l.url) + '" target="_blank" rel="noopener" title="' + esc(l.url) + '">' +

// ---------------- 页头：日期、同步状态、标签页图标
function syncHtml() {
  if (failed) return '<span class="sync bad">' + ico("warn", 14) + "连不上本机服务 · launchd 会自动拉起，稍等再刷新</span>";
  if (busy) return '<span class="sync busy">' + face("load", 16) + "正在挨个问各个会话…</span>";
  if (!state) return "";
  if (state.now - state.lastScan > state.scanIntervalMin * 60 + 300)
    return '<span class="sync bad">' + ico("warn", 14) + "超过 " + (state.scanIntervalMin + 5) + " 分钟没同步 · 看下服务是否在跑</span>";
  return '<span class="sync"><span class="dot"></span>已同步 ' + esc(state.lastScan ? when(state.lastScan) : "从未") + "</span>";
}
function renderTop() {
  document.querySelectorAll(".js-sync").forEach(el => { el.innerHTML = syncHtml(); });
  if (!state) return;
  document.querySelectorAll(".js-date").forEach(el => {
    el.textContent = state.nowText + (el.classList.contains("js-tz") && state.tzText ? " · " + state.tzText : "");
  });
  // 「现在需要你」大于 0 时，标签图标换成红脸，标题前加数字
  const n = needCount();
  document.title = (n ? "(" + n + ") " : "") + "AI 任务台账";
  if (iconRed !== n > 0) {
    iconRed = n > 0;
    const link = document.getElementById("favicon");
    link.type = "image/svg+xml";
    link.href = "data:image/svg+xml," + encodeURIComponent(iconRed ? FAV_RED : FAV);
  }
}

// ---------------- 看板：队列
function render() {
  if (!state) return;
  renderTop();
  renderQueue();
  renderDetail();
  if (tab === "history" && hReady) renderHistory();
}
function setView(v) {
  view = v; store("ledger.view", v);
  selKey = null; selIdx = 0; menuOpen = false;
  render();
  document.getElementById("queue").scrollTop = 0;
}
function renderQueue() {
  const items = viewItems(view), v = VIEWS[view];
  document.getElementById("tabs").innerHTML = TABS.map(id => {
    const c = viewItems(id).length, on = id === view;
    return '<button type="button" role="tab" class="tab" aria-selected="' + on + '" onclick="setView(\'' + id + '\')"><span>' + VIEWS[id].label + "</span>" +
      (id === "you" && c ? '<span class="count hot">' + c + "</span>" : '<span class="n">' + c + "</span>") + "</button>";
  }).join("");
  document.getElementById("qhint").textContent = view === "hidden"
    ? "最近 " + (state.windowDays || 14) + " 天完成或不再跟踪的。再和会话说话会自动回来，也可以手动恢复。" : v.hint;

  if (!items.some(it => it.key === selKey)) { const it = items[Math.min(selIdx, items.length - 1)]; selKey = it ? it.key : null; }
  selIdx = Math.max(0, items.findIndex(it => it.key === selKey));

  let html = "";
  if (view === "inbox" && items.length)
    html += '<div class="dash card"><b>先清一遍</b><span>这些会话停在半路、没写状态。按 J / K 往下看，没用的按 E 完成；确定都不要了，也可以一次清掉。</span>' +
      btn("这一组全部不再跟踪", "bulkUntrack()", "sec sm") + "</div>";

  let i = 0;
  html += groups.map(g => '<div class="qgroup"><span class="qlabel">' + REASON[g.f] + " · " + g.items.length + "</span>" +
    g.items.map(it => row(it, i++)).join("") + "</div>").join("");
  if (!items.length)
    html += '<div class="dash">' + face("logo", 32) + '<span class="tx"><b>' + v.emptyTitle + "</b><span>" + v.emptyText + "</span></span></div>";
  document.getElementById("qlist").innerHTML = html;
  document.getElementById("qfoot").innerHTML = view === "hidden" ? btn("返回「轮到你」", "setView('you')", "ghost xs")
    : state.hidden.length ? btn("已完成 / 不再跟踪 · " + state.hidden.length, "setView('hidden')", "ghost xs") : "";
}
function row(it, i) {
  const f = faceOf(it), on = it.key === selKey;

    '<span class="fc' + (hopNow.has(it.key) ? " bk-hop" : "") + '">' + face(f, 24, i) + "</span>" +
    '<span class="t" title="' + esc(it.title) + '">' + esc(it.title) + "</span>" +

function pick(key) {

  act("", "untrack", items.map(it => it.key));

  el.innerHTML = '<div class="detail-in">' + html + "</div>";
}
function toggleMenu() { menuOpen = !menuOpen; renderDetail(); }
function snoozeAt(opt) {
  // 和服务端 snooze_until 同一套算法，按工作时区算出几点，不让人心算
  const n = nowTs(), d = wd(n), base = n - (d.getUTCHours() * 3600 + d.getUTCMinutes() * 60 + d.getUTCSeconds());
  let t = base + 86400 + 9 * 3600;
  if (opt === "15m") t = n + 900;
  else if (opt === "1h") t = n + 3600;
  else if (opt === "3h") t = n + 3 * 3600;
  else if (opt === "tonight") { t = base + 21 * 3600; if (t <= n) t += 86400; }
  else if (opt === "monday") t = base + ((7 - (d.getUTCDay() + 6) % 7) % 7 || 7) * 86400 + 9 * 3600;
  return when(t);
}
function snoozeMenu(k) {
  return '<div class="menu" role="menu"><span class="ml">推迟到…</span>' + SNOOZE.map(o =>
    '<button type="button" role="menuitem" onclick="event.stopPropagation();act(\'' + k + "','snooze','" + o[0] + '\')"><span>' + o[1] +
    "</span><span>" + esc(snoozeAt(o[0])) + "</span></button>").join("") + "</div>";
}
function convo(it) {
  const d = it.details, msgs = [];
  if (d.firstPrompt) msgs.push({ you: true, label: "你 · 最初的要求", text: d.firstPrompt });
  if (d.lastPrompt) msgs.push({ you: true, label: "你 · 最后说的", text: d.lastPrompt });
  if (d.lastReply) msgs.push({ you: false, label: "它 · 最后说的", text: d.lastReply });
  if (!msgs.length) return "";
  return '<div class="part"><span class="sec-t">对话</span><div class="convo">' + msgs.map((m, i) => {
    if (m.you) return '<div class="msg you"><span class="ml">' + m.label + '</span><div class="bub">' + esc(m.text) + "</div></div>";
    const id = domId(it.key) + "_" + i, long = m.text.length > 160 || m.text.split("\n").length > 5, open = bubOpen[id];
    return '<div class="msg it">' + face("mark", 24) + '<div class="col"><span class="ml">' + m.label + '</span><div class="bub">' +
      (long && !open ? '<div class="clamp">' + esc(m.text) + "</div>" : esc(m.text)) + "</div>" + (long ? btn(open ? "收起" : "展开全文", "bubOpen['" + id + "']=!bubOpen['" + id + "'];renderDetail()", "ghost xs") : "") + "</div></div>";
  }).join("") + "</div></div>";
}
function goalSec(it) {
  const d = it.details;
  if (!d.goal)
    return '<div class="part"><span class="sec-t">目标</span><div class="nogoal"><span>还没写目标。有了一句目标，它跑偏的时候台账才能提醒你。</span>' +
      btn("让它补一句", "copyOpen(GOAL_ASK,'" + esc(it.key) + "')", "sec sm", "复制一句提示并打开会话，你粘贴发出去") + "</div></div>";
  return '<div class="part tight"><span class="sec-t">目标' + (d.goalStatus ? '<span class="pill">' + esc(d.goalStatus) + "</span>" : "") + "</span>" +
    '<p class="goal">' + esc(d.goal) + "</p>" + (d.criteria ? '<span class="goal-sub">完成标准：' + esc(d.criteria) + "</span>" : "") + "</div>";
}
function infoSec(it) {
  const d = it.details, k = esc(it.key);
  const rows = [
    ["原标题", d.originalTitle], ["位置", d.cwd], ["分支", d.branch], ["状态行", d.status, "wrap"],
    ["恢复命令", d.resume, "mono", btn(ico("copy", 13) + "复制", "copyClip(" + clip(d.resume) + ",'恢复命令已复制')", "ghost xs")]
  ].filter(r => r[1]);
  let foot = "";
  if (it.scheduleId) foot += btn("取消定时唤醒", "act('" + k + "','cancel_schedule')", "ghost sm");
  if (it.group !== "hidden") foot += btn("不再跟踪这个会话", "act('" + k + "','untrack')", "ghost sm");
  return '<div class="part"><span class="sec-t">会话信息</span><div class="info">' + rows.map(r =>
    '<div><span class="k">' + r[0] + '</span><span class="v ' + (r[2] || "") + '" title="' + esc(r[1]) + '">' + esc(r[1]) + "</span>" + (r[3] || "<span></span>") + "</div>").join("") +
    "</div>" + (foot ? '<div class="dfoot">' + foot + "</div>" : "") + "</div>";
}

// ---------------- 待你决定 / 推它一下：选项拼成一条回复，只复制并打开会话
function nudgesOf(it) { return faceOf(it) === "stuck" && it.kind === "interrupted" && !decisionsOf(it).length ? NUDGES : []; }
function pickOf(it) {
  const sig = JSON.stringify(decisionsOf(it));
  if (!picks[it.key] || picks[it.key].sig !== sig) picks[it.key] = { sig, sel: {}, quick: null, note: "" };  // AI 又回了一轮，旧的选择作废
  return picks[it.key];
}
function replyLines(it) {
  const p = pickOf(it), ds = decisionsOf(it);
  if (!ds.length) return p.quick != null ? nudgesOf(it)[p.quick] || "" : "";
  return ds.map((d, i) => (i + 1) + ". " + d.q.replace(/[？?：:。.\s]+$/, "") + "：" +
    (p.sel[i] != null ? d.opts[p.sel[i]] : !d.opts.length && p.note.trim() ? "见下面" : "待定")).join("\n");
}
function replyText(it) {
  const lines = replyLines(it), note = pickOf(it).note.trim();
  return lines + (lines && note ? "\n\n" : "") + note;
}
function replyHint(it) {
  const p = pickOf(it), ds = decisionsOf(it);
  if (!ds.length) return "也可以打开会话自己说";
  const left = ds.filter((d, i) => d.opts.length && p.sel[i] == null).length;
  return left ? "还有 " + left + " 件没选，会写成「待定」" : "都选好了，复制过去发给它";
}
function replyBox(it) {
  const ds = decisionsOf(it), nudges = nudgesOf(it);
  if (!ds.length && !nudges.length) return "";
  const p = pickOf(it), k = esc(it.key), lines = replyLines(it);
  let html = "";
  if (ds.length)
    html += '<div class="part"><div class="sec-hd"><span class="sec-t">待你决定 · ' + ds.length + '</span><span class="mono">已选 ' + Object.keys(p.sel).length + " / " + ds.length + "</span></div>" +
      '<div class="dlist">' + ds.map((d, i) => '<div class="dq"><span class="n">' + (i + 1) + '</span><span class="q">' + esc(d.q) + '</span><span class="opts">' +
        d.opts.map((o, j) => '<button type="button" class="opt" aria-pressed="' + (p.sel[i] === j) + '" onclick="pickOpt(\'' + k + "'," + i + "," + j + ')">' + esc(o) + "</button>").join("") +
        "</span></div>").join("") + "</div></div>";
  else
    html += '<div class="part"><span class="sec-t">推它一下</span><div class="opts-row">' + nudges.map((t, j) =>
      '<button type="button" class="opt lg" aria-pressed="' + (p.quick === j) + '" onclick="pickQuick(\'' + k + "'," + j + ')">' + esc(t) + "</button>").join("") + "</div></div>";
  return html + '<div class="reply"><span class="sec-l">回复它 · 会复制成这样</span>' +
    '<p class="rpre' + (lines ? "" : " ph") + '" id="rpre">' + esc(lines || "选一句，或者在下面自己写。") + "</p>" +
    '<textarea placeholder="还想补充的写在这里，会接在后面（可不填）" oninput="setNote(\'' + k + "',this)\">" + esc(p.note) + "</textarea>" +
    '<div class="rfoot"><span class="rh">' + esc(replyHint(it)) + '</span><span class="bs">' +
    btn("复制", "copyReply('" + k + "')", "sec hd") +
    btn("复制并打开会话" + ico("send"), "copyReply('" + k + "',true)", "pri hd", "复制到剪贴板并打开这个会话，你在输入框按 ⌘V 再回车") +
    "</span></div></div>";
}
function pickOpt(key, i, j) {
  const it = findItem(key);
  if (!it) return;
  const p = pickOf(it);
  if (p.sel[i] === j) delete p.sel[i]; else p.sel[i] = j;
  renderDetail();
}
function pickQuick(key, j) {
  const it = findItem(key);
  if (!it) return;
  const p = pickOf(it);
  p.quick = p.quick === j ? null : j;
  renderDetail();
}
function setNote(key, el) {
  const it = findItem(key);
  if (!it) return;
  pickOf(it).note = el.value;
  const lines = replyLines(it), pre = document.getElementById("rpre");
  pre.textContent = lines || "选一句，或者在下面自己写。";
  pre.classList.toggle("ph", !lines);
}
function copyReply(key, open) {
  const it = findItem(key);
  if (!it) return;
  const text = replyText(it);
  if (!text.trim()) return toast("先选一下要回什么");
  copyOpen(text, open ? key : null);
}

// ---------------- 改项目短码（只改名字；项目一律灰色，不再按项目上色）
let tagEdit = null;
function editTag(el) {
  const r = el.getBoundingClientRect();
  tagEdit = { project: el.dataset.p, label: el.dataset.l, color: el.dataset.c };
  const pop = document.getElementById("tagpop");
  pop.innerHTML = '<label for="tag-label">短码（「' + esc(tagEdit.project) + "」这个目录下的会话都用它）</label>" +
    '<input id="tag-label" maxlength="24" value="' + esc(tagEdit.label) + '">' +
    '<div class="bar">' + btn("恢复默认", "saveTag(true)", "ghost xs") + btn("取消", "closeTag()", "sec xs") + btn("保存", "saveTag()", "pri xs") + "</div>";
  pop.hidden = false;
  const left = Math.min(Math.max(8, r.left), window.innerWidth - pop.offsetWidth - 8);
  const top = r.bottom + 8 + pop.offsetHeight > window.innerHeight ? Math.max(8, r.top - pop.offsetHeight - 8) : r.bottom + 8;
  pop.style.left = left + "px"; pop.style.top = top + "px";
  const input = document.getElementById("tag-label");
  input.addEventListener("input", () => { tagEdit.label = input.value; });
  input.addEventListener("keydown", e => { if (e.key === "Enter") saveTag(); if (e.key === "Escape") closeTag(); });
  input.focus(); input.select();
}
function closeTag() { document.getElementById("tagpop").hidden = true; tagEdit = null; }
async function saveTag(reset) {
  if (!tagEdit) return;
  const arg = reset ? { project: tagEdit.project, label: "", color: "" }
    : { project: tagEdit.project, label: tagEdit.label.trim() === tagEdit.project ? "" : tagEdit.label.trim(), color: tagEdit.color };
  closeTag();
  try {
    const res = await post("tag", "", arg);
    toast(res.ok ? (reset ? "已恢复默认短码" : "短码已更新") : (res.message || "没成功"));
  } catch (e) { toast("操作失败：本机服务没响应"); }
  for (const k in hFull) delete hFull[k];
  load();
  if (hLoaded) search(hq);
}

// ---------------- 我说过的话（按会话）
let tab = location.hash === "#history" ? "history" : (store("ledger.tab") || "board");
let hq = "", hSessions = [], hTotal = 0, hAll = 0, hAllSessions = 0, hSince = "", hTimer = null, hLoaded = false, hReady = false;
const hFull = {};      // 会话 key -> 这个会话里你说过的全部话、目标、链接
const hOpen = {};      // 展开的会话
const hLong = {};      // 展开全文的单条
function setTab(t) {
  tab = t; store("ledger.tab", t);
  document.getElementById("view-board").hidden = t !== "board";
  document.getElementById("view-history").hidden = t !== "history";
  history.replaceState(null, "", t === "history" ? "#history" : "#");
  if (t === "history") { if (!hLoaded) search(hq); else if (hReady) renderHistory(); }
}
function goSearch() {
  setTab("history");
  const q = document.getElementById("q");
  q.focus(); q.select();
}
function clearSearch() {
  const q = document.getElementById("q");
  q.value = ""; q.focus();
  search("");
}
async function search(q, more) {
  hq = q; hLoaded = true;
  document.getElementById("q-clear").hidden = !q;
  const off = more ? hSessions.length : 0;
  const r = await fetch("/api/sessions?q=" + encodeURIComponent(q) + "&offset=" + off, { cache: "no-store" });
  const res = await r.json();
  if (q !== hq) return;  // 打字快时旧结果晚到，丢掉
  hSessions = more ? hSessions.concat(res.sessions) : res.sessions;
  hTotal = res.total; hAll = res.all; hAllSessions = res.allSessions; hSince = res.since;
  hReady = true;
  renderHistory();
}
async function toggleSession(key) {
  if (selecting()) return;
  if (hOpen[key]) {
    hOpen[key] = false; renderHistory();
    const el = document.getElementById("hs-" + domId(key));
    if (el && el.getBoundingClientRect().top < 0) el.scrollIntoView({ block: "start" });
    return;
  }
  if (!hFull[key]) {
    const r = await fetch("/api/session?key=" + encodeURIComponent(key), { cache: "no-store" });
    hFull[key] = await r.json();
  }
  hOpen[key] = true;
  renderHistory();
}
function hl(text) {
  let out = esc(text);
  const words = hq.split(/\s+/).filter(Boolean).map(w => esc(w).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  if (words.length) out = out.replace(new RegExp("(" + words.join("|") + ")", "gi"), "<mark>$1</mark>");
  return out;
}
function snippet(text) {
  // 折叠时从第一个命中词前面一点开始显示，免得命中的地方被折掉
  const words = hq.split(/\s+/).filter(Boolean);
  let at = -1;
  for (const w of words) { const i = text.toLowerCase().indexOf(w.toLowerCase()); if (i >= 0 && (at < 0 || i < at)) at = i; }
  return at > 120 ? "…" + text.slice(Math.max(0, at - 60)) : text;
}
function line(it, id) {
  const text = it.text;
  const long = text.length > 300 || text.split("\n").length > 6;
  const open = hLong[id];
  const imgs = (it.images || []).length ? '<div class="thumbs">' + it.images.map(f =>
    '<a href="/img/' + esc(f) + '" target="_blank" rel="noopener"><img src="/img/' + esc(f) + '" loading="lazy" alt=""></a>').join("") + "</div>" : "";
  return '<div class="hline"><span class="ht">' + esc(it.ts ? when(it.ts) : it.timeText) + "</span>" +
    '<div class="hx"><p class="htext' + (long && !open ? " clamp" : "") + '">' + hl(long && !open ? snippet(text) : text) + "</p>" + imgs + "</div>" +
    '<span class="hacts">' + (long ? btn(open ? "收起" : "展开全文", "hLong['" + id + "']=!hLong['" + id + "'];renderHistory()", "ghost xs") : "") +
    btn("复制", "copyClip(" + clip(text) + ")", "ghost xs") + "</span></div>";
}
function sessExtra(full) {
  if (!full || (!full.goal && !(full.links || []).length)) return "";
  let out = '<div class="sess-extra">';
  if (full.goal) out += '<span class="sec-l">目标' + (full.goalStatus ? '<span class="pill">' + esc(full.goalStatus) + "</span>" : "") +
    '</span><span class="goal-sub">' + esc(full.goal) + (full.criteria ? "\n完成标准：" + esc(full.criteria) : "") + "</span>";
  if ((full.links || []).length) out += '<span class="sec-l">AI 给过的链接 · ' + full.linksTotal + "，最近的在前</span>" + linkList(full.links);
  return out + "</div>";
}
function scard(s, si, faces) {
  const k = esc(s.key), open = hOpen[s.key], full = hFull[s.key];
  const items = open ? (full ? full.items : []) : s.preview;
  const fk = faces[s.key];
  const meta = [hq ? "命中 " + s.hits : "", s.count + " 句", s.linksTotal ? s.linksTotal + " 个链接" : "", s.lastTs ? when(s.lastTs) : s.lastText].filter(Boolean).join(" · ");
  const more = open ? "收起" + ico("up") : (s.count > 1 ? "展开全部 " + s.count + " 句" : "展开") + (s.goal || s.linksTotal ? "、目标和链接" : "") + ico("down");
  return '<article class="hcard" id="hs-' + domId(s.key) + '"><div class="fc">' + (fk ? face(fk, 24, si, REASON[fk]) : "") + "</div>" +
    '<div class="hbody"><div class="htop">' + tagChip(s) + "<h3>" + hl(s.title) + '</h3><span class="ag">' + esc(s.toolLabel) + '</span><span class="hm">' + esc(meta) + "</span></div>" +
    (open ? sessExtra(full) : "") +
    '<div class="hlines">' + items.map((it, i) => line(it, (open ? "f" : "p") + si + "_" + i)).join("") + "</div>" +
    '<div class="hfoot">' + btn(more, "toggleSession('" + k + "')", "ghost sm") + btn("打开会话" + ico("open"), "openSession('" + k + "',this)", "ghost sm") + "</div></div></article>";
}
function dayHead(ts) {
  const diff = dayNo(ts) - dayNo(nowTs());
  const y = wd(ts).getUTCFullYear() !== wd(nowTs()).getUTCFullYear() ? wd(ts).getUTCFullYear() + "年" : "";
  const label = diff === 0 ? "今天" : diff === -1 ? "昨天" : y + md(ts);
  return '<div class="dayh"><b>' + label + "</b><span>" + (diff >= -1 ? md(ts) + " " : "") + week(ts) + "</span></div>";
}
function renderHistory() {
  document.getElementById("hsum").innerHTML = (hq
    ? '<span class="mono hit">找到 ' + num(hTotal) + " 个会话</span>"
    : '<span class="mono">共 ' + num(hAllSessions) + " 个会话 · " + num(hAll) + " 句 · 最早到 " + esc(hSince) + "</span>") +
    '<span class="note">' + ico("info", 13) + "Claude Code 默认只保留最近 30 天的对话记录，更早的只剩台账另存的你说过的话</span>";
  const list = document.getElementById("hlist");
  if (hq && !hSessions.length) {
    list.innerHTML = '<div class="dash" style="margin: 0; padding: 20px; gap: 14px">' + face("search", 36) + '<span class="tx"><b>翻遍了，没找到「' + esc(hq) +
      "」</b><span>换个说法，或者少打几个词试试。</span></span></div>";
    return;
  }
  const faces = {};
  allItems(state).forEach(it => { faces[it.key] = faceOf(it); });
  let html = "", day = null;
  hSessions.forEach((s, i) => {
    const ts = s.lastTs || (s.preview[0] && s.preview[0].ts) || 0;
    const dn = ts ? dayNo(ts) : null;
    if (i === 0 || dn !== day) { html += (i ? "</section>" : "") + '<section class="day">' + (ts ? dayHead(ts) : ""); day = dn; }
    html += scard(s, i, faces);
  });
  if (hSessions.length) html += "</section>";
  if (hSessions.length < hTotal) html += btn("再加载 50 个会话", "search(hq, true)", "sec hd", "", 'style="align-self: flex-start"');
  list.innerHTML = html;
}

// ---------------- 事件
document.getElementById("logo-b").innerHTML = face("logo", 28);
document.getElementById("logo-h").innerHTML = face("logo", 32);
document.getElementById("q").addEventListener("input", e => {
  clearTimeout(hTimer);
  document.getElementById("q-clear").hidden = !e.target.value;
  hTimer = setTimeout(() => search(e.target.value.trim()), 250);
});
document.addEventListener("click", e => {
  if (menuOpen && !e.target.closest(".mwrap")) { menuOpen = false; renderDetail(); }
  if (tagEdit && !e.target.closest("#tagpop") && !e.target.closest(".chip")) closeTag();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    if (tagEdit) closeTag();
    if (menuOpen) { menuOpen = false; renderDetail(); }
    if (document.activeElement && document.activeElement.id === "q") document.activeElement.blur();
    return;
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); goSearch(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey || e.target.closest("input, textarea, select, [contenteditable]")) return;
  if (e.key === "/") { e.preventDefault(); goSearch(); return; }
  if (tab !== "board" || !state) return;
  const k = e.key.toLowerCase(), it = findItem(selKey);
  if (k === "j") move(1);
  else if (k === "k") move(-1);
  else if (k === "o" && it) openSession(it.key, document.getElementById("open-btn"));
  else if (k === "e" && it && it.group !== "hidden") act(it.key, "done");
  else if (k === "s" && it && it.group !== "hidden" && faceOf(it) !== "run") toggleMenu();
});
document.addEventListener("visibilitychange", () => { if (!document.hidden) load("1"); });
setInterval(() => { if (!document.hidden && !tagEdit) load("1"); }, 60000);  // 顺带读新记录，服务端一分钟最多读一次
load("1");
setTab(tab);
</script>
</body>
